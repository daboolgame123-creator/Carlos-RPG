name: PLAY48 exact first bakery loaf versus Huda's unpaid bounded wait
on:
  push:
    branches:
      - diagnostic/play48-unpaid-wage-tick-gate-20261116
    paths:
      - ".github/workflows/play48-unpaid-wage-tick.yml"
      - "simulation/scenarios/test_village/test_play48_huda_bakery_wait_tick.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-physical-wage-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - name: Inspect actual h24 plus 400-720 seconds bakery wage state and 12 copper
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src/carlos_sim scenarios/test_village/test_play48_huda_bakery_wait_tick.py
          PYTHONPATH=src:scenarios/test_village python -m pytest -sv scenarios/test_village/test_play48_huda_bakery_wait_tick.py
