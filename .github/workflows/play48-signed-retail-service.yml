name: PLAY48 genuine post-sale retail work salary from real cash (DRAFT NO MERGE)

on:
  push:
    branches:
      - experiment/play48-signed-retail-service-wage-20261113
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play48-commission-physical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  genuine-retail-payroll:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Verify immutable source SHA and real 13NPC local paid market work
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src/carlos_sim scenarios/test_village/test_play48_signed_retail_service_wage_24h.py
          PYTHONPATH=src:scenarios/test_village python -m pytest -sv scenarios/test_village/test_play48_signed_retail_service_wage_24h.py
