name: PLAY48 fast earned subsistence work gate (NO MERGE)
on:
  push:
    branches:
      - experiment/play48-earned-work-before-starvation-20261114
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: play48-earn-before-starve-${{ github.ref }}
  cancel-in-progress: true
jobs:
  paid-work-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Real 13 NPC wage source, precedence and negative invariants
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src/carlos_sim scenarios/test_village/test_play48_paid_shift_priority_fast.py
          PYTHONPATH=src:scenarios/test_village python -m pytest -sv scenarios/test_village/test_play48_paid_shift_priority_fast.py
