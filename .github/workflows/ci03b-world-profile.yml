name: CI-03b bounded 6h 24h world profile (non-release)

on:
  push:
    branches:
      - "engineering/ci-mig-baseline-20261110"
    paths:
      - ".github/workflows/ci03b-world-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci03b-world-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  twentyfour-hour-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert exact source
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install profiler fixture dependency
        run: python -m pip install pytest
      - name: Measure real PLAY-47 joined thirteen-resident world at 6h and 24h
        env:
          PYTHONPATH: src:scenarios/test_village
        run: |
          python - <<'PY'
          import cProfile
          import io
          import json
          import pathlib
          import pstats
          import tempfile
          import time
          from carlos_sim import SQLiteEventStore
          from test_play47_closure_endurance import _seed, _day, _reading, WORLD

          for hours in (6, 24):
              with tempfile.TemporaryDirectory(prefix="ci03b-world-") as root:
                  path = pathlib.Path(root) / "world.sqlite"
                  begin = time.perf_counter()
                  initial = _seed(path)
                  seed_seconds = time.perf_counter() - begin
                  assert initial.time == 0
                  profile = cProfile.Profile()
                  profile.enable()
                  state = _day(path, hours * 3600, step=6 * 3600, rain=False)
                  profile.disable()
                  elapsed = time.perf_counter() - begin - seed_seconds
                  reading = _reading(state)
                  assert state.time == hours * 3600
                  with SQLiteEventStore(path) as db:
                      event_count = db.db.execute(
                          "SELECT count(*) FROM events WHERE world_id=?", (WORLD,)
                      ).fetchone()[0]
                      assert db.verify(WORLD).to_dict() == state.to_dict()
                  result = {
                      "hours": hours, "wet": False, "people": len(state.npcs),
                      "clock_seconds": state.time, "revision": state.revision,
                      "seed_wall_seconds": round(seed_seconds, 4),
                      "profiled_wall_seconds": round(elapsed, 4),
                      "events": event_count,
                      "copper": 12, "hunger_at_max": reading["npc_hunger_cap"],
                      "market_sales": reading["market_sales"],
                      "baked": reading["baked"],
                      "wages": reading["wages"],
                  }
                  print("CI03B_CHECKPOINT_JSON " + json.dumps(result, sort_keys=True), flush=True)
                  buffer = io.StringIO()
                  pstats.Stats(profile, stream=buffer).sort_stats(
                      "cumulative"
                  ).print_stats("carlos_sim", 20)
                  print("CI03B_PROFILE_BEGIN " + str(hours), flush=True)
                  print(buffer.getvalue(), flush=True)
                  print("CI03B_PROFILE_END " + str(hours), flush=True)
          PY
