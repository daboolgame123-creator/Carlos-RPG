name: PLAY48 deferred genuine grain wage after actual bakery production

on:
  push:
    branches:
      - experiment/play48-deferred-bakery-grain-earned-wage-20261115
    paths:
      - ".github/workflows/play48-deferred-grain-payroll-original-ab.yml"
      - "simulation/src/carlos_sim/**"
      - "simulation/scenarios/test_village/test_play48_deferred_bakery_grain_wages_ab.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-forged-wages:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - name: Compile module and reject fake time-zero service
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src/carlos_sim scenarios/test_village/test_play48_deferred_bakery_grain_wages_ab.py
          PYTHONPATH=src:scenarios/test_village python -m pytest -sv scenarios/test_village/test_play48_deferred_bakery_grain_wages_ab.py -k no_payment

  original-13npc-economic-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - name: Real 13-person 48-hour comparison; no opening loaf reserved
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONPATH=src:scenarios/test_village python -m pytest -sv scenarios/test_village/test_play48_deferred_bakery_grain_wages_ab.py -k original_13npc
