name: PLAY48 prevent starving farmers from oscillating between work and bakery
on:
  push:
    branches: [experiment/play48-relief-work-trip-loop-20261121]
    paths:
      - 'simulation/src/carlos_sim/market_navigation.py'
      - 'simulation/src/carlos_sim/living_world.py'
      - 'simulation/tests/test_play48_cashless_known_road.py'
      - '.github/workflows/play48-relief-work-loop-experiment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  route-and-relief-regression:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Verify physical known road, actual market return, daily relief and owner-signed food
        working-directory: simulation
        env:
          PYTHONPATH: src:scenarios/test_village
        run: python -m pytest -q tests/test_play48_cashless_known_road.py tests/test_play48_community_rations.py
