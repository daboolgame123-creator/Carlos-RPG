name: PLAY-48 autonomous personally funded aid relay - targeted gate
on:
  push:
    branches: ["feature/play48-autonomous-funded-aid-20261110"]
    paths:
      - ".github/workflows/play48-autonomous-aid.yml"
      - "simulation/src/carlos_sim/npc_food_relief.py"
      - "simulation/src/carlos_sim/living_world.py"
      - "simulation/src/carlos_sim/assistance_autonomy.py"
      - "simulation/scenarios/test_village/test_play48_autonomous_funded_aid.py"
      - "simulation/scenarios/test_village/test_play48_autonomous_aid_guards.py"
      - "simulation/docs/PLAY_48_AUTONOMOUS_AID.md"
      - "simulation/docs/WORK_QUEUE.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: play48-relay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Confirm exact SHA, compile and run autonomous relay acceptance + regressions
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src scenarios
          PYTHONPATH=src python -m pytest -q -s \
            scenarios/test_village/test_play48_autonomous_funded_aid.py \
            scenarios/test_village/test_play48_autonomous_aid_guards.py \
            scenarios/test_village/test_play48_funded_food_aid.py \
            tests/test_assistance_autonomy.py \
            tests/test_assistance_autonomy_review.py \
            tests/test_assistance.py \
            tests/test_assistance_review.py \
            scenarios/test_village/test_play47_market_custody.py
