name: PLAY48 physical work opportunity guard (isolated)

on:
  push:
    branches:
      - experiment/play48-real-paid-work-eligibility-20261114
    paths:
      - ".github/workflows/play48-real-work-eligibility.yml"
      - "simulation/src/carlos_sim/living_world.py"
      - "simulation/tests/test_play48_hungry_paid_work_policy.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  short-focused-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact revision
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install only required test dependency
        run: python -m pip install pytest
      - name: Compile and test actual-job eligibility guards
        run: |
          python -m compileall -q src/carlos_sim/living_world.py tests/test_play48_hungry_paid_work_policy.py
          PYTHONPATH=src python -m pytest -q tests/test_play48_hungry_paid_work_policy.py
