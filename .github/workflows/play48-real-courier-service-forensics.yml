name: PLAY48 actual Huda and Hana delivery service provenance (diagnostic)

on:
  push:
    branches:
      - diagnostic/play48-real-courier-service-versus-wages-20261115
    paths:
      - ".github/workflows/play48-real-courier-service-forensics.yml"
      - "simulation/scenarios/test_village/test_play48_original_courier_service_forensics.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-courier-wage-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - name: Read actual authenticated water, grain, bread delivery events and wages
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src/carlos_sim scenarios/test_village/test_play48_original_courier_service_forensics.py
          PYTHONPATH=src:scenarios/test_village python -m pytest -q -s scenarios/test_village/test_play48_original_courier_service_forensics.py
