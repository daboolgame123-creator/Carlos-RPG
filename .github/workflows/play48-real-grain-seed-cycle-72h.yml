name: PLAY48 real crop seed return from actual grain wet 72h (NO MERGE)
on:
  push:
    branches:
      - experiment/play48-recover-seed-from-harvest-20261113
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: play48-finite-grain-seed-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-season-crop-cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Real grain-to-seed 13NPC crop reuse with sourced measured rain
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src/carlos_sim scenarios/test_village/test_play48_real_grain_seed_cycle_72h.py
          PYTHONPATH=src:scenarios/test_village python -m pytest -sv scenarios/test_village/test_play48_real_grain_seed_cycle_72h.py
