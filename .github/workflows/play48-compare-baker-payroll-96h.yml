name: PLAY48 compare real 96h baker wage receipts without rerunning world
on:
  push:
    paths:
      - simulation/scenarios/test_village/play48_compare_96h_baker_payroll.py
      - .github/workflows/play48-compare-baker-payroll-96h.yml
    branches:
      - experiment/play48-baker-food-wage-12h-20261118
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare-authentic-96h:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - name: Download previously verified 36h wage 96h genuine state
        uses: actions/download-artifact@v4
        with:
          name: play48-baker-rescue-real-96h-ffba00fffc3915c3db5e51f1cefd0f26f4d99630
          repository: daboolgame123-creator/Carlos-RPG
          run-id: 44284735091
          github-token: ${{ github.token }}
          path: simulation/baseline
      - name: Download verified 12h trial 96h genuine state
        uses: actions/download-artifact@v4
        with:
          name: play48-baker-12h-real72-to96-07008816c648f519f2d130311ed9795a9a295ebc
          repository: daboolgame123-creator/Carlos-RPG
          run-id: 44316294573
          github-token: ${{ github.token }}
          path: simulation/trial
      - name: Inspect physical receipts, bakery obligations and true delta at 96h
        working-directory: simulation
        env:
          PYTHONPATH: src:scenarios/test_village
        run: python -u scenarios/test_village/play48_compare_96h_baker_payroll.py --baseline baseline --trial trial --output real96-baker-wages.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play48-96h-baker-wage-real-delta-${{ github.sha }}
          path: simulation/real96-baker-wages.json
          if-no-files-found: warn
