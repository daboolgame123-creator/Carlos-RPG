name: PLAY48 P8 genuine offshift shopkeeper return
on:
  push:
    branches: [experiment/play48-real234-courier-relief-audit-20261123]
  pull_request:
    branches: [experiment/play48-signed-steward-wage-quote-release-20261123]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Off-duty home commute and P7 protection regressions
        working-directory: simulation
        env:
          PYTHONPATH: src:tests:scenarios/test_village
        run: |
          python -m pytest -q tests/test_play48_offshift_shopkeeper_homeward.py tests/test_play48_steward_earned_wage_quote_release.py
  genuine-h234-walk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - name: Retrieve real immutable P7 hour 234 signed wage ledger
        uses: actions/download-artifact@v4
        with:
          name: play48-p7-real228-steward-wage-8a31e3c9cbd03a5f6ebb24e75d00abbc73d2a7ca
          repository: daboolgame123-creator/Carlos-RPG
          run-id: 45145919540
          github-token: ${{ github.token }}
          path: simulation/evidence/authentic234
      - name: Run physical known-road travel on independently copied P7 history
        working-directory: simulation
        env:
          PYTHONPATH: src:scenarios/test_village
        run: python -u scenarios/test_village/play48_real234_offshift_keeper_homeward.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play48-p8-real234-offshift-travel-${{ github.sha }}
          path: simulation/real234_keeper_homeward/
          if-no-files-found: warn
