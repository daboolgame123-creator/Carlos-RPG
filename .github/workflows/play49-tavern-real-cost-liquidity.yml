name: PLAY49 real tavern menu-cost liquidity audit
on:
  push:
    branches: [experiment/play49-tavern-real-cost-and-liquidity-20261116]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-four-shop-price-and-cash-owner-gates:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Exact physical 4-market real-cooked-meal economics and cash-owner isolation
        working-directory: simulation
        env:
          PYTHONPATH: src:tests
        run: |
          python -m compileall -q src/carlos_sim tests/test_play49_fruit_stall_contract.py tests/test_play49_dairy_stall_contract.py tests/test_play49_tavern_trade_provenance.py tests/test_play49_tavern_cooked_meal.py tests/test_play49_tavern_cost_liquidity_audit.py
          python -m pytest -q -v tests/test_play49_fruit_stall_contract.py tests/test_play49_dairy_stall_contract.py tests/test_play49_tavern_trade_provenance.py tests/test_play49_tavern_cooked_meal.py tests/test_play49_tavern_cost_liquidity_audit.py
