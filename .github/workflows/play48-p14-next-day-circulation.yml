name: PLAY48 P14 authentic next-day market food and incomes
on:
  push:
    branches: [experiment/play48-p14-next-day-circulation-20261123]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  genuine-next-day-economy:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install scenario integration imports
        run: python -m pip install pytest
      - name: Download immutable P11 h264 real SQLite
        uses: actions/download-artifact@v4
        with:
          repository: daboolgame123-creator/Carlos-RPG
          run-id: 45186883684
          name: play48-p11-renewable-h264-af1025807f4fb5f3b653bdd6a8dbee3bb01f8455
          path: simulation/evidence/p14_real264
          github-token: ${{ github.token }}
      - name: Replay unchanged P12 opt-in policies through next aid day h294
        working-directory: simulation
        env:
          PYTHONPATH: src:scenarios/test_village
        run: python -u scenarios/test_village/play48_p14_next_day_circulation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play48-p14-authentic-next-day-${{ github.sha }}
          path: simulation/play48_p14_next_day/continuation.json
          if-no-files-found: warn
