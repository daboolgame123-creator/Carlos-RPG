name: PLAY48 original 13-NPC signed sale wage 36h A/B (experimental)

on:
  push:
    branches:
      - experiment/play48-signed-merchant-sale-wages-20261115
    paths:
      - ".github/workflows/play48-steward-earned-sale-ab.yml"
      - "simulation/src/carlos_sim/**"
      - "simulation/scenarios/test_village/test_play48_merchant_sale_wage_ab.py"
      - "simulation/scenarios/test_village/test_play48_real_watch_income_24h.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-merchant-sale-wage-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact HEAD
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install regression harness
        run: python -m pip install pytest
      - name: Compile merchant source, guard and original 13-NPC controlled AB
        run: |
          python -m compileall -q src/carlos_sim scenarios/test_village/test_play48_merchant_sale_wage_ab.py
          PYTHONPATH=src:scenarios/test_village python -m pytest -sv scenarios/test_village/test_play48_merchant_sale_wage_ab.py
