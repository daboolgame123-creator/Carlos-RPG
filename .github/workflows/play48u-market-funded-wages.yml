name: PLAY-48U signed market-owned funded courier wages
on:
  push:
    branches: ["experiment/play48u-market-sourced-wage-refill-20261111"]
    paths:
      - ".github/workflows/play48u-market-funded-wages.yml"
      - "simulation/src/carlos_sim/courier_provisions.py"
      - "simulation/src/carlos_sim/domain.py"
      - "simulation/src/carlos_sim/store.py"
      - "simulation/src/carlos_sim/living_world.py"
      - "simulation/scenarios/test_village/test_play48s_authentic_courier_food_wages.py"
      - "simulation/scenarios/test_village/test_play48h3_early_market_wage.py"
      - "simulation/scenarios/test_village/test_play48u_signed_market_refill.py"
permissions:
  contents: read
concurrency:
  group: play48u-market-refill-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security-and-true-genesis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Signed employer vs forged payment, schema/rules and replay
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src scenarios/test_village/test_play48u_signed_market_refill.py
          PYTHONPATH=src python -m pytest -qs scenarios/test_village/test_play48u_signed_market_refill.py -k "not true_48h"
  genuine-48h-market-payroll-ab:
    needs: security-and-true-genesis
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: True water-limited grain-to-bread market wages, two days
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONPATH=src python -m pytest -qs scenarios/test_village/test_play48u_signed_market_refill.py -k "true_48h"
