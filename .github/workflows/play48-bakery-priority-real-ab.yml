name: PLAY48 authenticated bakery wages before speculative cargo reservation
on:
  push:
    branches:
      - experiment/play48-bakery-payroll-before-market-cargo-20261116
    paths:
      - ".github/workflows/play48-bakery-priority-real-ab.yml"
      - "simulation/src/carlos_sim/**"
      - "simulation/scenarios/test_village/test_play48_deferred_bakery_grain_wages_ab.py"
      - "simulation/scenarios/test_village/test_play48_real_watch_income_24h.py"
      - "simulation/scenarios/test_village/test_play48_in_kind_market_wages_ab.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  anti-forgery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - name: Verify fake or premature bakery service cannot be paid
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src/carlos_sim scenarios/test_village/test_play48_deferred_bakery_grain_wages_ab.py
          PYTHONPATH=src:scenarios/test_village python -m pytest -sv scenarios/test_village/test_play48_deferred_bakery_grain_wages_ab.py -k no_payment
  genuine-original-13npc-economic-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - name: Real 13NPC signed bakery labor before market cargo 48-hour A/B, strict delivery gates
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONPATH=src:scenarios/test_village python -m pytest -sv scenarios/test_village/test_play48_deferred_bakery_grain_wages_ab.py -k original_13npc
