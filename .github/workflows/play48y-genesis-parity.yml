name: PLAY-48Y protect original genesis and reject unauthorized farm food
on:
  push:
    branches: ["experiment/play48y-farm-worksite-paid-courier-20261111"]
    paths:
      - ".github/workflows/play48y-genesis-parity.yml"
      - "simulation/scenarios/test_village/test_play48y_original_genesis_parity.py"
      - "simulation/scenarios/test_village/test_play47_joined_professions.py"
permissions:
  contents: read
concurrency:
  group: play48y-historical-genesis-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-sha-original-economy-genesis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Historical default genesis identical; reject extra farm stock
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONPATH=src python -m pytest -qs scenarios/test_village/test_play48y_original_genesis_parity.py
