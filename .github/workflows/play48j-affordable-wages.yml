name: PLAY-48J affordable 2-copper earned wages and employer remittance reserve
on:
  push:
    branches: ["feature/play48-j-affordable-wages-vs-one-coin-20261110"]
    paths:
      - ".github/workflows/play48j-affordable-wages.yml"
      - "simulation/src/carlos_sim/supply.py"
      - "simulation/scenarios/test_village/test_play47_joined_professions.py"
      - "simulation/scenarios/test_village/test_play48j_affordable_payroll.py"
      - "simulation/docs/PLAY_48J_AFFORDABLE_PAYROLL.md"
permissions:
  contents: read
concurrency:
  group: play48j-affordable-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-escrow-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Prove initial finite money and site reserve boundaries, no scripts
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONPATH=src python -m compileall -q src/carlos_sim/supply.py scenarios/test_village/test_play47_joined_professions.py scenarios/test_village/test_play48j_affordable_payroll.py
          PYTHONPATH=src python -m pytest -qs scenarios/test_village/test_play48j_affordable_payroll.py \
            -k "bakery_profit or employer_terms"
  genuine-two-day-market-cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install pytest
      - name: Two-day physically caused economy versus one-copper wage world
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONPATH=src python -m pytest -qs scenarios/test_village/test_play48j_affordable_payroll.py \
            -k "actual_13npc_two_day_affordability"
