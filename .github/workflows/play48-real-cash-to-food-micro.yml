name: PLAY48 genuine physically funded work-wage-bread micro chain (NO MERGE)
on:
  push:
    branches:
      - qa/play48-real-sale-wage-food-chain-20261114
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-real-income-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Real market proceeds fund real work then a real paid eaten loaf
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src/carlos_sim scenarios/test_village/test_play48_full_income_causality_micro.py
          PYTHONPATH=src:scenarios/test_village python -m pytest -q -s scenarios/test_village/test_play48_full_income_causality_micro.py
