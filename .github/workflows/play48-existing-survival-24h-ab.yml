name: PLAY48 same-genesis real foraging and aid 24h A B (NO MERGE)

on:
  push:
    branches:
      - feature/play48-authorized-physical-food-for-work-20261113
    paths:
      - ".github/workflows/play48-existing-survival-24h-ab.yml"
      - "simulation/scenarios/test_village/test_play48_existing_foraging_aid_ab_24h.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play48-existing-survival-24h-${{ github.ref }}
  cancel-in-progress: true

jobs:
  physical-subistence-control-experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Same physical worlds, genuine optional foraging and assistance
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src/carlos_sim scenarios/test_village/test_play48_existing_foraging_aid_ab_24h.py
          PYTHONPATH=src:scenarios/test_village python -m pytest -sv scenarios/test_village/test_play48_existing_foraging_aid_ab_24h.py
