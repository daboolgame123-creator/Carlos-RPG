name: CI-04b head snapshot replay A/B proof (research only)
on:
  push:
    branches: ["engineering/ci04b-replay-ab-20261110"]
    paths:
      - ".github/workflows/ci04b-replay-ab-probe.yml"
      - "engineering/probes/ci04b_head_snapshot_ab.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci04b-${{ github.ref }}
  cancel-in-progress: true
jobs:
  replay-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: contract
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 38ef0049478e4d62fd465dadc7c1eaf406b9b4d2
          path: target
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest for genuine scenario imports
        run: python -m pip install pytest
      - name: Run bounded PLAY-47 6h replay A/B and adversarial equivalence
        env:
          PYTHONPATH: target/simulation/src:target/simulation/scenarios/test_village
        run: |
          test "$(git -C contract rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C target rev-parse HEAD)" = "38ef0049478e4d62fd465dadc7c1eaf406b9b4d2"
          python contract/engineering/probes/ci04b_head_snapshot_ab.py
