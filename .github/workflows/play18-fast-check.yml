name: PLAY-18 local NPC social-witness checks

on:
  push:
    branches:
      - simulation-engine-phase-play-18-local-social-witness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Validate observation scope, prior memories and replay
        run: |
          python -m compileall -q src tests
          PYTHONPATH=src:scenarios/test_village:tests python -m pytest -q \
            tests/test_player_local_social_witness_batch_18.py \
            tests/test_player_visible_activity_memory_batch_17.py \
            tests/test_player_witnessed_memory_batch_16.py \
            tests/test_social_autonomy.py \
            tests/test_player_perception.py \
            tests/test_player_gateway.py
