name: PLAY-29 trusted per-world metabolism calibration experiment
on:
  push:
    branches:
      - "design/play29-opt-in-metabolism-20261108"
      - "design/play29-activity-hunger-fullgate-20261108"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-world-metabolism:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Verify real NPC clock, configuration integrity and SQLite replay
        env:
          PYTHONPATH: "src:scenarios/test_village"
        run: |
          python -m compileall -q src tests/test_play29_metabolism_policy.py
          python -m pytest -q tests/test_play29_metabolism_policy.py tests/test_play29_food_security_audit.py
