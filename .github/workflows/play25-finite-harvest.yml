name: PLAY-25 finite autonomous field-to-bread supply

on:
  push:
    branches:
      - simulation-engine-phase-play-25-finite-harvest
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile source, scenario and tests
        run: python -m compileall -q src scenarios/test_village tests
      - name: Run finite farm supply and existing bakery/market regression
        run: |
          PYTHONPATH=src:tests:scenarios/test_village python -m pytest -q \
            tests/test_play_finite_harvest_batch_25.py \
            tests/test_play_economic_autonomy_batch_24.py \
            tests/test_play_food_chain_batch_23.py \
            tests/test_production_02b.py \
            tests/test_market_02c.py \
            tests/test_consumption.py
      - name: Run genuine seven-NPC finite farm trials
        run: PYTHONPATH=src:scenarios/test_village python -u scenarios/test_village/play_finite_harvest.py
