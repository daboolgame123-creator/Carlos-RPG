name: PLAY-48 reopened — pre-signed real farm escrow and physical 13-NPC A/B
on:
  push:
    branches:
      - feature/play48-reopened-income-food-168h-20261111
    paths:
      - ".github/workflows/play48-reopened-farm-escrow.yml"
      - "simulation/src/carlos_sim/courier_provisions.py"
      - "simulation/src/carlos_sim/living_world.py"
      - "simulation/src/carlos_sim/domain.py"
      - "simulation/src/carlos_sim/store.py"
      - "simulation/scenarios/test_village/test_play48_reopened_wage_baseline.py"
      - "simulation/scenarios/test_village/test_play48aa_actual_barter_bread_return.py"
      - "simulation/scenarios/test_village/test_play48h3_early_market_wage.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: play48-reopened-real-farm-wage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-source-security-and-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Exact SHA, syntax and event-source adversarial constraints
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src scenarios/test_village/test_play48_reopened_wage_baseline.py
          PYTHONPATH=src python -m pytest -qs scenarios/test_village/test_play48_reopened_wage_baseline.py -k "not genuine_13npc_return_can_escrow_one_future_farm_wage and not genuine_returned_bread"
  real-48h-thirteen-person-wage-ab:
    needs: exact-source-security-and-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Genuine physically delivered bakery bread signed into FARM escrow
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONPATH=src python -m pytest -qs scenarios/test_village/test_play48_reopened_wage_baseline.py -k "genuine_13npc_return_can_escrow_one_future_farm_wage"
