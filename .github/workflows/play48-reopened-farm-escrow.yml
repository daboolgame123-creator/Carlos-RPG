name: PLAY-48 reopened — physical farm payroll and 96h/168h real economy
on:
  push:
    branches:
      - feature/play48-reopened-income-food-168h-20261111
    paths:
      - ".github/workflows/play48-reopened-farm-escrow.yml"
      - "simulation/src/carlos_sim/courier_provisions.py"
      - "simulation/src/carlos_sim/living_world.py"
      - "simulation/src/carlos_sim/domain.py"
      - "simulation/src/carlos_sim/store.py"
      - "simulation/scenarios/test_village/test_play48_reopened_wage_baseline.py"
      - "simulation/scenarios/test_village/test_play48aa_actual_barter_bread_return.py"
      - "simulation/scenarios/test_village/test_play48h3_early_market_wage.py"
      - "simulation/scenarios/test_village/play48_reopened_endurance_runner.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: play48-reopened-real-farm-wage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-source-security-and-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Exact SHA, syntax and event-source adversarial constraints
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src scenarios/test_village/test_play48_reopened_wage_baseline.py
          PYTHONPATH=src python -m pytest -qs scenarios/test_village/test_play48_reopened_wage_baseline.py -k "not genuine_13npc_return_can_escrow_one_future_farm_wage and not genuine_returned_bread"
  real-48h-thirteen-person-wage-ab:
    needs: exact-source-security-and-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Genuine physically delivered bakery bread signed into FARM escrow
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONPATH=src python -m pytest -qs scenarios/test_village/test_play48_reopened_wage_baseline.py -k "genuine_13npc_return_can_escrow_one_future_farm_wage"

  genuine-96h-and-168h-economic-acceptance:
    needs: real-48h-thirteen-person-wage-ab
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Real 13-NPC identical-genesis A/B must survive 96h and 168h
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONPATH=src:scenarios/test_village python scenarios/test_village/play48_reopened_endurance_runner.py

  reject-authentic-prior-45-61-save:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 290828cef1d38e8680b4836ff52cd36828c58bdb
          path: prior-45-61
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create real old Rules61 SQLite with frozen engine and reject byte-identically
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONPATH=../prior-45-61/simulation/src python - <<'PY'
          from carlos_sim import SQLiteEventStore
          from carlos_sim.domain import SCHEMA_VERSION, RULES_VERSION
          assert (SCHEMA_VERSION, RULES_VERSION) == (45, 61)
          with SQLiteEventStore("authentic-prior-rules61.sqlite") as db:
              s = db.create_world("prior-rules61")
              assert db.verify("prior-rules61").to_dict() == s.to_dict()
          PY
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import sqlite3
          from carlos_sim import SQLiteEventStore
          from carlos_sim.domain import SCHEMA_VERSION, RULES_VERSION
          from carlos_sim.store import UnsupportedVersion
          assert (SCHEMA_VERSION, RULES_VERSION) == (45, 62)
          p=Path("authentic-prior-rules61.sqlite")
          before=sha256(p.read_bytes()).hexdigest()
          with SQLiteEventStore(p) as db:
              try:
                  db.verify("prior-rules61")
              except UnsupportedVersion:
                  pass
              else:
                  raise AssertionError("Rules61 save silently accepted as Rules62")
          after=sha256(p.read_bytes()).hexdigest()
          assert before == after
          with sqlite3.connect(p) as raw:
              assert raw.execute("SELECT schema_version, rules_version FROM worlds").fetchone() == (45,61)
              assert raw.execute("PRAGMA integrity_check").fetchone() == ("ok",)
          print("PLAY48_REOPENED_OLD_45_61_SAVE_REJECTED_BYTE_IDENTICAL", before, flush=True)
          PY
