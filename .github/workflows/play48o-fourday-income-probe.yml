name: PLAY-48O genuine 13-NPC four-day income and grain A-B
on:
  push:
    branches: ["experiment/play48o-13npc-fourday-endurance-20261110"]
    paths:
      - ".github/workflows/play48o-fourday-income-probe.yml"
      - "simulation/scenarios/test_village/test_play48o_four_day_economy.py"
permissions:
  contents: read
concurrency:
  group: play48o-fourday-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-four-day-autonomy:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Verify exact SHA and execute 24, 48, 72, 96h genuine A/B checkpoints
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONPATH=src python -m compileall -q scenarios/test_village/test_play48o_four_day_economy.py
          PYTHONPATH=src python -m pytest -qs scenarios/test_village/test_play48o_four_day_economy.py
