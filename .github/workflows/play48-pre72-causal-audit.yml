name: PLAY48 pre72 genuine economic bottleneck forensics (NO RELEASE)
on:
  push:
    branches:
      - experiment/play48-pre72-causal-audit-20261112
    paths:
      - ".github/workflows/play48-pre72-causal-audit.yml"
      - "simulation/scenarios/test_village/play48_pre72_causal_audit.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: play48-pre72-forensics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  genuine-read-only-24-48-72-hour-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test-fixture dependency
        run: python -m pip install pytest
      - name: Verify exact tested source and compile the independent probe
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src scenarios/test_village/play48_pre72_causal_audit.py
      - name: Read-only economic audit of identical real 13-NPC control and candidate
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONPATH=src:scenarios/test_village python scenarios/test_village/play48_pre72_causal_audit.py
