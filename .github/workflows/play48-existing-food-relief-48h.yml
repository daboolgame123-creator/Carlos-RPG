name: PLAY48 existing autonomous aid and real road food relief 48h A/B (NO MERGE)
on:
  push:
    branches:
      - experiment/play48-existing-aid-logistics-20261113
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: play48-real-preexisting-aid-${{ github.ref }}
  cancel-in-progress: true
jobs:
  factual-real-48h:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Real 13NPC physical 48h support and no resource mint
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src/carlos_sim scenarios/test_village/test_play48_existing_food_relief_48h.py
          PYTHONPATH=src:scenarios/test_village python -m pytest -sv scenarios/test_village/test_play48_existing_food_relief_48h.py
