name: PLAY-23 finite grain-to-meal integration

on:
  push:
    branches:
      - simulation-engine-phase-play-23-food-chain
  workflow_dispatch:

permissions:
  contents: read

jobs:
  food-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile and test grain production, market ownership and real NPC meals
        run: |
          python -m compileall -q src scenarios/test_village tests
          PYTHONPATH=src:scenarios/test_village:tests python -m pytest -q \
            tests/test_play_food_chain_batch_23.py \
            tests/test_production_02b.py \
            tests/test_market_02c.py \
            tests/test_consumption.py
      - name: Run both real grain-to-meal world trials
        run: |
          PYTHONPATH=src python -u scenarios/test_village/play_food_chain.py
