name: PLAY-46 atomic compound recipes

on:
  push:
    branches:
      - "feature/play46-multi-input-atomic-recipes-20261109"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Compile and verify compound receipts
        run: |
          python -m compileall -q src scenarios
          PYTHONPATH=src python -m pytest -q -s scenarios/test_village/test_play46_multi_input.py \
            scenarios/test_village/test_play46_physical_chain.py
      - name: Validate protected legacy material and economy contracts
        run: |
          PYTHONPATH=src python -m pytest -q \
            scenarios/test_village/test_play45_multisector.py \
            scenarios/test_village/test_play44_autonomous_grain.py \
            scenarios/test_village/test_play43_grain_deposit.py
      - name: Checkout exact PLAY-45 Schema 41 / Rules 56 predecessor
        uses: actions/checkout@v5
        with:
          ref: a6c20e3edfbe85cc68819cd4fadd909472b21fd5
          path: previous
          persist-credentials: false
      - name: Produce genuine predecessor SQLite world with event and snapshot
        env:
          PYTHONPATH: ../previous/simulation/src
        run: |
          python - <<'PY'
          from carlos_sim import DomainEvent, SQLiteEventStore
          with SQLiteEventStore("play45-original.sqlite") as db:
              s = db.create_world("predecessor-41-56")
              s = db.append("predecessor-41-56", "old:bootstrap", s.revision, [
                  DomainEvent("LocationCreated", None, "old genuine code", 0,
                              {"id": "old_site", "name": "Old Site"}),
                  DomainEvent("ResourceChanged", None, "old original coin", 0,
                              {"owner_id": "old_site", "resource": "coin_copper",
                               "previous": None, "current": 2, "source": "initialization"}),
              ], bootstrap=True)
              db.snapshot("predecessor-41-56")
              assert db.verify("predecessor-41-56").to_dict() == s.to_dict()
          PY
      - name: Reject old saved world without changing its bytes
        env:
          PYTHONPATH: src
          CARLOS_PREDECESSOR_SQLITE: play45-original.sqlite
        run: |
          python -m pytest -q -s \
            scenarios/test_village/test_play46_multi_input.py \
            -k genuine_41_56
