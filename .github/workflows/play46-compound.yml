name: PLAY-46 atomic compound recipes

on:
  push:
    branches:
      - "feature/play46-multi-input-atomic-recipes-20261109"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Compile and verify compound receipts
        run: |
          python -m compileall -q src scenarios
          PYTHONPATH=src python -m pytest -q -s scenarios/test_village/test_play46_multi_input.py
      - name: Validate protected legacy material and economy contracts
        run: |
          PYTHONPATH=src python -m pytest -q \
            scenarios/test_village/test_play45_multisector.py \
            scenarios/test_village/test_play44_autonomous_grain.py \
            scenarios/test_village/test_play43_grain_deposit.py
