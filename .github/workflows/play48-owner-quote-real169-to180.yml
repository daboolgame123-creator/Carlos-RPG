name: PLAY48 authentic h169 to180 P3 P4 sustained local aid
on:
  push:
    branches: [experiment/play48-owner-signed-relief-quote-reallocation-20261121]
    paths:
      - 'simulation/scenarios/test_village/play48_owner_relief_real169_to180.py'
      - '.github/workflows/play48-owner-quote-real169-to180.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  genuine-169-to180:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - name: Download genuine saved original P3 P4 h169 event histories
        uses: actions/download-artifact@v4
        with:
          name: play48-original168-owner-quote-a-b-39f811a5c8d7398390a125f21d927abacb21d5d9
          repository: daboolgame123-creator/Carlos-RPG
          run-id: 44926598784
          github-token: ${{ github.token }}
          path: simulation/evidence/saved169
      - name: Replay two authenticated old P3 P4 histories without fresh seed to h174 and h180
        working-directory: simulation
        env:
          PYTHONPATH: src:scenarios/test_village
        run: python -u scenarios/test_village/play48_owner_relief_real169_to180.py
      - name: Persist 13-NPC events, conserved copper and final comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play48-original-saved169-to180-${{ github.sha }}
          path: simulation/relief180/
          if-no-files-found: warn
