name: PLAY-38 multi-farm physical courier routes

on:
  push:
    branches:
      - feature/play38-multifarm-physical-couriers-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authentic-farm-logistics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile all engine and tests
        run: python -m compileall -q src tests scenarios/test_village
      - name: Verify both independent fields and physical couriers
        run: |
          PYTHONPATH=src:tests:scenarios/test_village python -m pytest -q -s \
            scenarios/test_village/test_play38_multi_farm_couriers.py \
            scenarios/test_village/test_play37_food_feasibility.py \
            scenarios/test_village/test_play35_food_chain_bottlenecks.py
