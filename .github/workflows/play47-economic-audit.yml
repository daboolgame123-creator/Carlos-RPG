name: PLAY-47 NPC economic audit pilot

on:
  push:
    branches:
      - "feature/play47-*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Check out genuine Schema 41 / Rules 56 predecessor
        uses: actions/checkout@v5
        with:
          ref: a6c20e3edfbe85cc68819cd4fadd909472b21fd5
          path: play47-predecessor
          persist-credentials: false
      - name: Generate and reject authentic old save without mutation
        run: |
          PYTHONPATH=../play47-predecessor/simulation/src python - <<'PY'
          from carlos_sim import DomainEvent, SQLiteEventStore
          with SQLiteEventStore("play47-predecessor.sqlite") as db:
              state = db.create_world("predecessor-41-56")
              state = db.append("predecessor-41-56", "old:bootstrap", state.revision, [
                  DomainEvent("LocationCreated", None, "genuine old runtime", 0,
                              {"id": "old_site", "name": "Old Site"}),
                  DomainEvent("ResourceChanged", None, "finite old copper", 0,
                              {"owner_id": "old_site", "resource": "coin_copper",
                               "previous": None, "current": 2, "source": "initialization"}),
              ], bootstrap=True)
              assert db.snapshot("predecessor-41-56").to_dict() == db.verify("predecessor-41-56").to_dict() == state.to_dict()
          PY
          CARLOS_PREDECESSOR_SQLITE=play47-predecessor.sqlite PYTHONPATH=src \
            python -m pytest -q -s scenarios/test_village/test_play46_multi_input.py -k genuine_41_56
      - name: Compile and audit real autonomous NPC economy
        run: |
          python -m compileall -q src scenarios/test_village/test_play47_economic_audit.py
          PYTHONPATH=src python -m pytest -q -s scenarios/test_village/test_play47_economic_audit.py             scenarios/test_village/test_play46_physical_chain.py \
            scenarios/test_village/test_play47_seven_npc_survival.py \
            scenarios/test_village/test_play47_joined_professions.py \
            scenarios/test_village/test_play47_joined_feasibility.py \
            scenarios/test_village/test_play47_net_food_capacity.py \
            scenarios/test_village/test_play47_72h_endurance.py \
            scenarios/test_village/test_play47_courier_diagnostics.py \
            scenarios/test_village/test_play47_two_field_liquidity.py \
            scenarios/test_village/test_play47_closure_endurance.py \
            scenarios/test_village/test_play42_market_shopping.py \
            scenarios/test_village/test_play40_copper_cash_courier.py \
            scenarios/test_village/test_play41_funded_wage.py \
            tests/test_market_02c.py \
            tests/test_navigation.py \
            tests/test_play_physical_supply_batch_27.py
