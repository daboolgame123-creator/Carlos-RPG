name: PLAY49 isolated physical fruit market
on:
  push:
    branches: [experiment/play49-fruit-stall-physical-contract-20261116]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  market-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Two staffed markets real harvest wages sales travel integrity
        working-directory: simulation
        env:
          PYTHONPATH: src:tests
        run: |
          python -m compileall -q src/carlos_sim tests/test_play49_fruit_stall_contract.py
          python -m pytest -q -v tests/test_play49_fruit_stall_contract.py
