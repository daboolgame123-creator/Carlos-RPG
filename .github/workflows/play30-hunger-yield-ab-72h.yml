name: PLAY-30 real 72-hour seven-NPC crop-yield hunger A/B
on:
  push:
    branches:
      - "experiment/play30-72h-hunger-yield-ab-20261108"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-hunger:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Observe 72h of real hunger, finite seed/water and crop-yield-only A/B
        env:
          PYTHONPATH: "src:scenarios/test_village"
        run: |
          python -m compileall -q src scenarios/test_village/test_play30_hunger_yield_ab.py
          python -m pytest -q -s scenarios/test_village/test_play30_hunger_yield_ab.py
