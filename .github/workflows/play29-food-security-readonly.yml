name: PLAY-29 read-only seven-NPC food-access diagnostics
on:
  push:
    branches:
      - "design/play29-food-security-readonly-20261108"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  food-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Compile and test private diagnosis without NPC mutation
        env:
          PYTHONPATH: "src:scenarios/test_village"
        run: |
          python -m compileall -q src/carlos_sim/food_security_audit.py prototypes/play29_food_capacity.py
          python -m pytest -q tests/test_play29_food_security_audit.py prototypes/test_play29_food_capacity.py
