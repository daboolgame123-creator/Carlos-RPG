name: PLAY48 REAL 13NPC physical food transport and market (NO MERGE)

on:
  push:
    branches:
      - feature/play48-authorized-physical-food-for-work-20261113
    paths:
      - ".github/workflows/play48-real-peddler-short.yml"
      - "simulation/src/carlos_sim/food_peddler.py"
      - "simulation/src/carlos_sim/economic_autonomy.py"
      - "simulation/src/carlos_sim/living_world.py"
      - "simulation/scenarios/test_village/test_play47_joined_professions.py"
      - "simulation/scenarios/test_village/test_play48_peddler_fast.py"
      - "simulation/scenarios/test_village/test_play48_peddler_real_short.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play48-real-peddler-short-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verified-five-hour-physical-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runner
        run: python -m pip install pytest
      - name: Verify exact head and fast source selector checks
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src/carlos_sim scenarios/test_village/test_play48_peddler_real_short.py
          PYTHONPATH=src:scenarios/test_village python -m pytest -q scenarios/test_village/test_play48_peddler_fast.py
      - name: Genuine five-hour 13NPC purchase haul resale + SQLite replay
        run: PYTHONPATH=src:scenarios/test_village python -m pytest -sv scenarios/test_village/test_play48_peddler_real_short.py
