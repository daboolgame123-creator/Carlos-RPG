name: PLAY48 bakery original real food wage Huda 48h A-B (NO MERGE)
on:
  push:
    branches:
      - experiment/play48-huda-single-bakery-service-food-20261114
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: play48-huda-real-bakery-payment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bakery-paid-authentic-grain:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10","3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Honest dual world 48h worker and employer physical livelihood
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src/carlos_sim scenarios/test_village/test_play48_huda_bakery_real_wage_48h.py
          PYTHONPATH=src:scenarios/test_village python -m pytest -sv scenarios/test_village/test_play48_huda_bakery_real_wage_48h.py
