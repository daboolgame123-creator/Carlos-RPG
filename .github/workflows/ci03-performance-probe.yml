name: CI-03 measured sample (non-release)
on:
  push:
    branches:
      - "engineering/ci-mig-baseline-20261110"
    paths:
      - ".github/workflows/ci03-performance-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci03-sample-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source identity
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Short bounded test sample with durations
        run: |
          PYTHONPATH=src python -m pytest -q --durations=15 \
            scenarios/test_village/test_play46_multi_input.py \
            scenarios/test_village/test_play47_market_custody.py \
            tests/test_market_02c.py \
            -k "not genuine_41_56"
      - name: Sample profiling of one-hour compound economy audit (not full endurance)
        run: |
          PYTHONPATH=src python -m cProfile -o "${{ runner.temp }}/ci03-profile.pstats" -m pytest -q -s \
            scenarios/test_village/test_play47_economic_audit.py::test_autonomous_compound_economy_audit_pilot_one_hour
          python - "${{ runner.temp }}/ci03-profile.pstats" <<'PY'
          import pstats
          import sys
          stats = pstats.Stats(sys.argv[1])
          print("CI03_PROFILE_TOP_CUMULATIVE")
          stats.sort_stats("cumulative").print_stats(30)
          print("CI03_PROFILE_SIMULATION_HOTSPOTS")
          stats.sort_stats("cumulative").print_stats("carlos_sim", 30)
          PY
