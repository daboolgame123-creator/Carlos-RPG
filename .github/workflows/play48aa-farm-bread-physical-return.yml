name: PLAY-48AA signed grain-for-bread share on real bakery-to-farm return road
on:
  push:
    branches: ["experiment/play48aa-physical-grain-for-bread-return-20261111"]
    paths:
      - ".github/workflows/play48aa-farm-bread-physical-return.yml"
      - "simulation/src/carlos_sim/supply.py"
      - "simulation/src/carlos_sim/domain.py"
      - "simulation/scenarios/test_village/test_play47_joined_professions.py"
      - "simulation/scenarios/test_village/test_play48aa_actual_barter_bread_return.py"
permissions:
  contents: read
concurrency:
  group: play48aa-real-bakery-food-${{ github.ref }}
  cancel-in-progress: true
jobs:
  signed-share-and-hostile-freight:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: New Schema45/Rules60 immutable signed contract and unauthorized pickup rejection
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src scenarios/test_village/test_play48aa_actual_barter_bread_return.py
          PYTHONPATH=src python -m pytest -qs scenarios/test_village/test_play48aa_actual_barter_bread_return.py -k "not true_48h"
  true-48hour-thirteen-person-economic-lane:
    needs: signed-share-and-hostile-freight
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: True barter and two-person courier circuits through full 48h with SQLite replay
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONPATH=src python -m pytest -qs scenarios/test_village/test_play48aa_actual_barter_bread_return.py -k "true_48h"
