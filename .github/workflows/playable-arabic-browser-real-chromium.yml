name: Carlos real Chromium native Arabic form click
on:
  push:
    branches: [feature/carlos-arabic-browser-local-play-20261123]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-chromium-click:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Playwright driver for CI only (use preinstalled runner Chrome)
        run: |
          python -m pip install playwright
          which google-chrome || which chromium || true
      - name: Click native RTL form in actual Chromium browser
        working-directory: simulation
        env:
          PYTHONPATH: src:scenarios/test_village
          PYTHONIOENCODING: utf-8
        run: python -u scenarios/test_village/playable_browser_chromium_probe.py
