name: PLAY48 exact physical grain/bread timing and Huda co-presence diagnostic
on:
  push:
    branches:
      - diagnostic/play48-huda-bakery-wage-timing-20261115
    paths:
      - ".github/workflows/play48-huda-bakery-wage-clock.yml"
      - "simulation/scenarios/test_village/test_play48_huda_bakery_wage_clock.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-grain-wage-clock:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - name: Inspect actual grain delivery bakery production and worker location at h24-30
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src/carlos_sim scenarios/test_village/test_play48_huda_bakery_wage_clock.py
          PYTHONPATH=src:scenarios/test_village python -m pytest -sv scenarios/test_village/test_play48_huda_bakery_wage_clock.py
