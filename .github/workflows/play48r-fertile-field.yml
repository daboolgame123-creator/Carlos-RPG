name: PLAY-48R physical fertile crop 13-NPC real 48h A-B
on:
  push:
    branches: ["experiment/play48r-fertile-field-real-harvest-20261111"]
    paths:
      - ".github/workflows/play48r-fertile-field.yml"
      - "simulation/scenarios/test_village/test_play38_multi_farm_couriers.py"
      - "simulation/scenarios/test_village/test_play48h3_early_market_wage.py"
      - "simulation/scenarios/test_village/test_play48r_fertile_field.py"
      - "simulation/scenarios/test_village/test_play48q_real_food_capacity.py"
permissions:
  contents: read
concurrency:
  group: play48r-recipe-farm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bounded-genesis-and-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Same SHA, finite crop yields, zero cash/food injections and replay
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONPATH=src python -m compileall -q scenarios/test_village/test_play38_multi_farm_couriers.py scenarios/test_village/test_play48h3_early_market_wage.py scenarios/test_village/test_play48r_fertile_field.py
          PYTHONPATH=src python -m pytest -qs scenarios/test_village/test_play48r_fertile_field.py -k "not true_13npc_48h"
  actual-forty-eight-hour-comparison:
    needs: bounded-genesis-and-provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Actual physically timed 24h and 48h 13-NPC causality and funds
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONPATH=src python -m pytest -qs scenarios/test_village/test_play48r_fertile_field.py -k "true_13npc_48h"
