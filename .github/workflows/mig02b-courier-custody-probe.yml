name: MIG-02b courier custody historical semantic probe
on:
  push:
    branches: ["engineering/ci-mig-baseline-20261110"]
    paths: [".github/workflows/mig02b-courier-custody-probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  true-courier-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: a6c20e3edfbe85cc68819cd4fadd909472b21fd5
          path: predecessor
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 38ef0049478e4d62fd465dadc7c1eaf406b9b4d2
          path: target
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Produce genuine predecessor physical delivery and save complete projection
        env:
          PYTHONPATH: predecessor/simulation/src:predecessor/simulation/tests:predecessor/simulation/scenarios/test_village
        run: |
          test "$(git -C predecessor rev-parse HEAD)" = "a6c20e3edfbe85cc68819cd4fadd909472b21fd5"
          test "$(git -C target rev-parse HEAD)" = "38ef0049478e4d62fd465dadc7c1eaf406b9b4d2"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from test_play_physical_supply_batch_27 import begin,tick
          from carlos_sim.domain import SCHEMA_VERSION,RULES_VERSION
          assert (SCHEMA_VERSION,RULES_VERSION)==(41,56)
          p=Path("genuine-courier-41-56.sqlite")
          db,clock,engine=begin(p,water=2)
          try:
              start=db.load("village") if False else None
              state=tick(db,engine,200,"migrate-courier-200").state
              assert state.time==200
              assert state.supply_circuits and state.travels
              assert db.verify(state.world_id).to_dict()==state.to_dict()
              Path("courier-original.json").write_text(json.dumps(state.to_dict(),sort_keys=True))
          finally:
              clock.close_session(state.world_id)
              db.close()
          print("MIG02B_COURIER_ORIGINAL",json.dumps({
              "world_id":state.world_id,"revision":state.revision,
              "circuits":len(state.supply_circuits),"travels":len(state.travels),
              "hash":hashlib.sha256(p.read_bytes()).hexdigest()},sort_keys=True))
          PY
      - name: Try strict no-write 42-57 replay with historical command capabilities and receipts
        env:
          PYTHONPATH: target/simulation/src
        run: |
          python - <<'PY'
          import hashlib,inspect,json,sqlite3
          from pathlib import Path
          from carlos_sim.domain import WorldState,DomainEvent,apply_event,canonical_hash,SCHEMA_VERSION,RULES_VERSION
          assert (SCHEMA_VERSION,RULES_VERSION)==(42,57)
          p=Path("genuine-courier-41-56.sqlite")
          before=hashlib.sha256(p.read_bytes()).hexdigest()
          expected=json.loads(Path("courier-original.json").read_text())
          world_id=expected["world_id"]
          cx=sqlite3.connect("file:genuine-courier-41-56.sqlite?mode=ro",uri=True)
          cx.row_factory=sqlite3.Row
          world=cx.execute("SELECT * FROM worlds WHERE id=?",(world_id,)).fetchone()
          assert (world["schema_version"],world["rules_version"])==(41,56)
          genesis=json.loads(world["initial_state"])
          assert canonical_hash(genesis)==world["initial_hash"]
          genesis["schema_version"],genesis["rules_version"]=42,57
          state=WorldState.from_dict(genesis)
          caps=[name for name in inspect.signature(apply_event).parameters
                if name=="bootstrap" or name.endswith("_authorized")]
          assert set(caps)<={r["name"] for r in cx.execute("PRAGMA table_info(commands)")}
          sql="SELECT e.seq,e.payload,e.hash,c.request_hash,"+",".join("c."+n for n in caps)+" FROM events e LEFT JOIN commands c ON c.world_id=e.world_id AND c.command_id=e.command_id WHERE e.world_id=? ORDER BY e.seq"
          status="compatible"
          reason=""
          types={}
          for row in cx.execute(sql,(world_id,)):
              assert row["seq"]==state.revision+1, "event gap in original history"
              payload=json.loads(row["payload"])
              assert canonical_hash(payload)==row["hash"] and row["request_hash"] is not None
              event=DomainEvent.from_dict(payload)
              types[event.event_type]=types.get(event.event_type,0)+1
              try:
                  state=apply_event(state,event,**{n:bool(row[n]) for n in caps})
              except (ValueError,TypeError) as exc:
                  status="unsupported_semantics"
                  reason="event %d %s: %s"%(row["seq"],event.event_type,str(exc))
                  break
          if status=="compatible":
              expected["schema_version"],expected["rules_version"]=42,57
              diffs=[k for k in expected if expected[k]!=state.to_dict()[k]]
              if diffs:
                  status="unsupported_semantics"
                  reason="field mismatches: "+",".join(diffs)
              else:
                  assert state.revision==world["revision"] and state.time==world["sim_time"]
          cx.close()
          assert hashlib.sha256(p.read_bytes()).hexdigest()==before
          print("MIG02B_COURIER_PARITY_RESULT",json.dumps({
              "status":status,"reason":reason,"old_source_unchanged":True,
              "processed_revisions":state.revision,"source_revisions":world["revision"],
              "event_types_seen":types,"historical_courier":True},sort_keys=True))
          PY
