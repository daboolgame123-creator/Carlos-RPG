name: PLAY-29 pure physical food capacity audit
on:
  push:
    branches:
      - "design/play29-food-capacity-20261108"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capacity-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Audit theoretical food demand without modifying game rules
        run: |
          python -m compileall -q prototypes
          python -m pytest -q prototypes/test_play29_food_capacity.py
