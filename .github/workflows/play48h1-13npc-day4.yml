name: PLAY-48H1 real thirteen-NPC 96-hour preventive wage versus no-wage comparison
on:
  push:
    branches: ["experiment/play48h1-13npc-day4-counterfactual-20261110"]
permissions:
  contents: read
concurrency:
  group: play48h1-day4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  genuine-day4:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Run original thirteen residents from same SQLite genesis versus finite employer-provisioned workers to day four
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONPATH=src python -m pytest -q -s \
            scenarios/test_village/test_play48h1_day4_control.py
