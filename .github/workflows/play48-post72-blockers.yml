name: PLAY-48 96h multi-day courier economic blockade proof
on:
  push:
    branches: ["feature/play48-repeatable-physical-loops-20261110"]
    paths:
      - ".github/workflows/play48-post72-blockers.yml"
      - "simulation/scenarios/test_village/test_play48_post72_blockers.py"
      - "simulation/src/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: play48-96h-${{ github.ref }}
  cancel-in-progress: true
jobs:
  endurance-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Verify authentic 13-NPC 96h event ledger and blocking causality
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONPATH=src python -m pytest -q -s scenarios/test_village/test_play48_post72_blockers.py
