name: PLAY-48V exact-SHA experimental Schema44 Rules59 full regression
on:
  push:
    branches: ["experiment/play48v-genuine-market-wages-96h-20261111"]
    paths:
      - ".github/workflows/play48v-full-regression.yml"
permissions:
  contents: read
concurrency:
  group: play48v-full-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: All existing historical tests vs experimental new version
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src tests scenarios
          python -m pytest -q --tb=line
