name: PLAY-28 three-day live survival endurance

on:
  push:
    branches:
      - simulation-engine-phase-play-28-survival-rest
  workflow_dispatch:

permissions:
  contents: read

jobs:
  true-life:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Syntax check
        run: python -m compileall -q src tests scenarios/test_village
      - name: Test three real in-world days with scarcity and finite provisions
        run: PYTHONPATH=src:tests:scenarios/test_village python -m pytest -q -s tests/test_play_three_day_survival_batch_28.py
