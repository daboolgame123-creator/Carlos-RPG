name: PLAY-48Y2 authentic farm wage 13 NPC real 96h occupational economy
on:
  push:
    branches: ["experiment/play48y2-farm-wage-96h-and-workforce-20261111"]
    paths:
      - ".github/workflows/play48y2-96h-npc-economy.yml"
      - "simulation/scenarios/test_village/test_play48y2_huda_wage_npc_income_96h.py"
permissions:
  contents: read
concurrency:
  group: play48y2-farm-96h-${{ github.ref }}
  cancel-in-progress: true
jobs:
  true-four-day-autonomy-and-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Authenticated SAME genesis farm wage 13-NPC 96h individual incomes
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q scenarios/test_village/test_play48y2_huda_wage_npc_income_96h.py
          PYTHONPATH=src python -m pytest -qs scenarios/test_village/test_play48y2_huda_wage_npc_income_96h.py
