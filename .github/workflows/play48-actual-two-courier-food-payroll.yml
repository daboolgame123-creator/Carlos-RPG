name: PLAY48 actual funded courier food wages 48h A-B (NO MERGE)
on:
  push:
    branches:
      - experiment/play48-paid-courier-escrow-20261113
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: play48-actual-two-courier-wages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-courier-payments:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: 13NPC 12 copper 3 initial loaves real service-backed jobs and replay
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src/carlos_sim scenarios/test_village/test_play48_true_courier_escrow_ab_48h.py
          PYTHONPATH=src:scenarios/test_village python -m pytest -sv scenarios/test_village/test_play48_true_courier_escrow_ab_48h.py
