name: PLAY-37B real full-NPC metabolism and food-production counterfactual

on:
  push:
    branches:
      - feature/play37b-metabolism-production-counterfactual-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-npc-causal-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile simulation
        run: python -m compileall -q src tests scenarios/test_village
      - name: Compare 48h of full NPC autonomy with only pre-existing metabolism policy changing
        run: |
          PYTHONPATH=src:tests:scenarios/test_village python -m pytest -q -s \
            scenarios/test_village/test_play37b_metabolism_production.py \
            scenarios/test_village/test_play37_food_feasibility.py
