name: PLAY-21 seven-NPC food ecology integration

on:
  push:
    branches:
      - simulation-engine-phase-play-21-ecology
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecology:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile and test integrated ecology, earlier NPC hunger and player forage
        run: |
          python -m compileall -q src scenarios/test_village tests
          PYTHONPATH=src:scenarios/test_village:tests python -m pytest -q \
            tests/test_play_food_ecology_batch_21.py \
            tests/test_play_adversity_batch_20.py \
            tests/test_play_npc_survival_batch_15.py \
            tests/test_player_foraging_batch_11.py
      - name: Run two real NPC food-ecology scenarios
        run: |
          PYTHONPATH=src python scenarios/test_village/play_food_ecology.py
