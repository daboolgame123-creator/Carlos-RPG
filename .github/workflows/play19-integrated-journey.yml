name: PLAY-19 integrated seven-NPC village journey

on:
  push:
    branches:
      - simulation-engine-phase-play-19-integrated-village-journey
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journey:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile and test entire PLAY-19 integrated journey
        run: |
          python -m compileall -q src scenarios/test_village tests
          PYTHONPATH=src:scenarios/test_village:tests python -m pytest -q \
            tests/test_play_integrated_journey_batch_19.py \
            tests/test_player_local_social_witness_batch_18.py \
            tests/test_player_visible_activity_memory_batch_17.py \
            tests/test_player_witnessed_memory_batch_16.py \
            tests/test_player_gifts_batch_07.py \
            tests/test_player_foraging_batch_11.py \
            tests/test_player_eating_batch_13.py
      - name: Run real journey and print auditable public events
        run: |
          PYTHONPATH=src python scenarios/test_village/play_integrated_journey.py
