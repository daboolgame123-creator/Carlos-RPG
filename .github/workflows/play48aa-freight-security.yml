name: PLAY-48AA adversarial farm bread freight and market rights
on:
  push:
    branches: ["integration/play48aa-schema45-regression-20261111"]
    paths:
      - ".github/workflows/play48aa-freight-security.yml"
      - "simulation/scenarios/test_village/test_play48aa_barter_security.py"
permissions:
  contents: read
concurrency:
  group: play48aa-adversarial-bakery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  signed-cargo-adversarial-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Exact SHA, real signed world and hostile fake cargo/claims/shop credits
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src scenarios/test_village/test_play48aa_barter_security.py
          PYTHONPATH=src python -m pytest -qs scenarios/test_village/test_play48aa_barter_security.py
