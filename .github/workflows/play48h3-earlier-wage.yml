name: PLAY-48H3 real funded early courier wage A/B
on:
  push:
    branches: ["feature/play48h3-earlier-backed-courier-wage-20261110"]
    paths:
      - ".github/workflows/play48h3-earlier-wage.yml"
      - "simulation/src/carlos_sim/courier_provisions.py"
      - "simulation/src/carlos_sim/living_world.py"
      - "simulation/scenarios/test_village/test_play48h3_early_market_wage.py"
      - "simulation/docs/PLAY_48H3_EARLIER_FUNDED_WAGE.md"
permissions:
  contents: read
concurrency:
  group: play48h3-fullAB-${{ github.ref }}
  cancel-in-progress: true
jobs:
  funded-wage:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Real 13-NPC physical early wage and 96h paired causal comparison
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONPATH=src python -m pytest -qs \
            scenarios/test_village/test_play48h1_funded_courier_provision.py \
            scenarios/test_village/test_play48h2_access_diagnostic.py \
            scenarios/test_village/test_play48h3_early_market_wage.py
