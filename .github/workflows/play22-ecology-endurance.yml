name: PLAY-22 finite-food ecological endurance

on:
  push:
    branches:
      - simulation-engine-phase-play-22-ecology-endurance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  endurance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile and test endurance, ecology and prior food conservation
        run: |
          python -m compileall -q src scenarios/test_village tests
          PYTHONPATH=src:scenarios/test_village:tests python -m pytest -q \
            tests/test_play_ecology_endurance_batch_22.py \
            tests/test_play_food_ecology_batch_21.py \
            tests/test_play_adversity_batch_20.py
      - name: Execute actual one-hour village on two SQLite worlds
        run: |
          PYTHONPATH=src python -u scenarios/test_village/play_ecology_endurance.py
