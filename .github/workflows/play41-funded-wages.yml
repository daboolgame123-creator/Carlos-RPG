name: PLAY-41 one-time funded production wages
on:
  push:
    branches:
      - feature/play41-funded-production-wages-20261108
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-labor-income:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile engine and scenario tests
        run: python -m compileall -q src tests scenarios/test_village
      - name: One signed salary per real job; no forged, duplicate or unpaid cash
        run: |
          PYTHONPATH=src:tests:scenarios/test_village python -m pytest -q -s \
            scenarios/test_village/test_play41_funded_wage.py \
            scenarios/test_village/test_play40_copper_cash_courier.py \
            scenarios/test_village/test_play38_multi_farm_couriers.py
