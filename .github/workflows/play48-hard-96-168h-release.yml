name: PLAY48 HARD physical wet-season 96 and 168h release acceptance (NO MERGE)
on:
  push:
    branches:
      - experiment/play48-96-168-real-endurance-20261113
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: play48-hard-horizon-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sustainable-13npc-168h:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Hard 168h conservation, food, water and late real service gates
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src/carlos_sim scenarios/test_village/test_play48_hard_96_168h_release_gate.py
          PYTHONPATH=src:scenarios/test_village python -m pytest -sv scenarios/test_village/test_play48_hard_96_168h_release_gate.py
