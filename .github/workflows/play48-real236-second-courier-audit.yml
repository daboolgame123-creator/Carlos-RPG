name: PLAY48 P9 read-only genuine h236 second courier food audit
on:
  push:
    branches: [experiment/play48-p9-second-courier-finite-food-20261123]
    paths:
      - 'simulation/scenarios/test_village/play48_real236_second_courier_audit.py'
      - '.github/workflows/play48-real236-second-courier-audit.yml'
  pull_request:
    branches: [experiment/play48-courier-earned-food-diagnosis-20261122]
permissions:
  contents: read
  actions: read
jobs:
  read-genuine-h236:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - name: Retrieve immutable real P8 h236 save from verified successful run
        uses: actions/download-artifact@v4
        with:
          name: play48-p8-real229-well-food-a-b-ba0162ae3692638a073cdd0197b4f02b57c551a1
          repository: daboolgame123-creator/Carlos-RPG
          run-id: 45026222815
          github-token: ${{ github.token }}
          path: simulation/evidence/authentic236
      - name: Examine genuinely owned food and donor-known routes without mutations
        working-directory: simulation
        env:
          PYTHONPATH: src:scenarios/test_village
        run: python -u scenarios/test_village/play48_real236_second_courier_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play48-real236-p9-donor-audit-${{ github.sha }}
          path: simulation/real236_second_courier_diagnostics/
          if-no-files-found: warn
