name: PLAY-48H prototype versioned historical regression pins
on:
  push:
    branches: ["integration/play48h1-43-58-regression-gates-20261110"]
    paths:
      - ".github/workflows/play48h1-regression-pins.yml"
      - ".github/workflows/simulation-tests.yml"
      - "simulation/tests/**"
      - "simulation/docs/PLAY_48H_DAY4_OUTCOME.md"
permissions:
  contents: read
concurrency:
  group: play48h1-versioned-pins-${{ github.ref }}
  cancel-in-progress: true
jobs:
  versioned-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Check exact head and no legacy version was globally reinterpreted
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          grep -q "SCHEMA_VERSION = 43" src/carlos_sim/domain.py
          grep -q "RULES_VERSION = 58" src/carlos_sim/domain.py
          grep -q "new\['rules_version'\] == 58" ../.github/workflows/simulation-tests.yml
      - name: Previously failed historical current-version gate files
        run: |
          PYTHONPATH=src python -m pytest -q \
            tests/test_backup_resume.py \
            tests/test_environment_02a.py \
            tests/test_knowledge_compatibility.py \
            tests/test_loans_02d.py \
            tests/test_loans_02d_integration.py \
            tests/test_market_02c.py \
            tests/test_market_02c_integrity.py \
            tests/test_persisted_injuries_03a.py \
            tests/test_play28b_hydrology_integrated.py \
            tests/test_play29_activity_hunger_policy.py \
            tests/test_play29_metabolism_policy.py \
            tests/test_play_crop_cycle_batch_26.py \
            tests/test_play_physical_supply_batch_27.py \
            tests/test_player_eating_batch_13.py \
            tests/test_player_foraging_batch_11.py \
            tests/test_player_rpg.py \
            tests/test_player_timed_foraging_batch_12.py \
            tests/test_production_02b.py \
            tests/test_production_02b_integrity.py \
            tests/test_routines_02f.py \
            tests/test_rumors_02g.py \
            tests/test_temperament_02e.py \
            tests/test_temperament_02e_integrity.py
