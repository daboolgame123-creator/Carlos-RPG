name: PLAY-30C existing local stock and finite-copper purchasing
on:
  push:
    branches:
      - "experiment/play30c-stocked-market-proof-20261108"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-market:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Prove purchases use actual local stock, owned copper and replay
        env:
          PYTHONPATH: "src:scenarios/test_village"
        run: |
          python -m compileall -q src scenarios/test_village/test_play30c_stocked_market.py
          python -m pytest -q -s scenarios/test_village/test_play30c_stocked_market.py
