name: PLAY48 fast physical peddler contracts and route selectors (NO MERGE)

on:
  push:
    branches:
      - feature/play48-authorized-physical-food-for-work-20261113
    paths:
      - "simulation/src/carlos_sim/food_peddler.py"
      - "simulation/src/carlos_sim/economic_autonomy.py"
      - "simulation/src/carlos_sim/living_world.py"
      - "simulation/scenarios/test_village/test_play47_joined_professions.py"
      - "simulation/scenarios/test_village/test_play48_peddler_fast.py"
      - ".github/workflows/play48-fast-peddler.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play48-fast-peddler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  physically-backed-peddler:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deterministic test runner
        run: python -m pip install pytest
      - name: Exact source compile and real genesis/selectors
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src/carlos_sim scenarios/test_village/test_play48_peddler_fast.py
          PYTHONPATH=src:scenarios/test_village python -m pytest -sv scenarios/test_village/test_play48_peddler_fast.py
