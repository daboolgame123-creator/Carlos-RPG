name: PLAY-48P personal wage to real local bread access forensic
on:
  push:
    branches: ["analysis/play48p-wage-to-food-access-20261110"]
    paths:
      - ".github/workflows/play48p-wage-food-access.yml"
      - "simulation/scenarios/test_village/test_play48p_wage_food_access_audit.py"
permissions:
  contents: read
concurrency:
  group: play48p-access-${{ github.ref }}
  cancel-in-progress: true
jobs:
  same-13-person-causal-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Exact-SHA operator-only same-cash no-teleport forensic
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONPATH=src python -m compileall -q scenarios/test_village/test_play48p_wage_food_access_audit.py
          PYTHONPATH=src python -m pytest -qs scenarios/test_village/test_play48p_wage_food_access_audit.py
