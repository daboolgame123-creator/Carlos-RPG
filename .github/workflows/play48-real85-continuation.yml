name: PLAY48 genuine saved84 plus 10 minutes to real85
on:
  push:
    branches: [experiment/play48-saved84-short-diagnostic-20261121]
    paths:
      - 'simulation/scenarios/test_village/play48_saved84_10min_to85.py'
      - '.github/workflows/play48-real85-continuation.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  genuine-p0-p1-85h:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - name: Get actual original saved84-plus-ten-minute P0 and P1 event ledgers
        uses: actions/download-artifact@v4
        with:
          name: play48-saved84-10min-route-probe-2a1b4ff125e58ae550aef79ab419a78295c3533f
          repository: daboolgame123-creator/Carlos-RPG
          run-id: 44886638700
          github-token: ${{ github.token }}
          path: simulation/evidence/short84
      - name: Continue both physical economies to 85h and inspect historical travel causes
        working-directory: simulation
        env:
          PYTHONPATH: src:scenarios/test_village
        run: python -u scenarios/test_village/play48_saved84_10min_to85.py
      - name: Persist independent genuine 85h original-world ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play48-genuine-p0-vs-p1-real85-${{ github.sha }}
          path: simulation/real85/
          if-no-files-found: warn
