name: PLAY48 h24 to h36 exact Huda and farm blocker audit (NO MERGE)
on:
  push:
    branches:
      - diagnostic/play48-farm-courier-time-gates-20261113
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: play48-actual-work-courier-36h-${{ github.ref }}
  cancel-in-progress: true
jobs:
  physical-measured-routes:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Full actual 13NPC 36h rainy-season circuit and farm causality
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src/carlos_sim scenarios/test_village/test_play48_huda_farm_36h_gates.py
          PYTHONPATH=src:scenarios/test_village python -m pytest -sv scenarios/test_village/test_play48_huda_farm_36h_gates.py
