name: MIG-02 pinned source semantic preflight (non-release)

on:
  push:
    branches:
      - "engineering/ci-mig-baseline-20261110"
    paths:
      - ".github/workflows/mig02-semantic-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: contract
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: a6c20e3edfbe85cc68819cd4fadd909472b21fd5
          path: predecessor
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 38ef0049478e4d62fd465dadc7c1eaf406b9b4d2
          path: target
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert pinned sources and validate disabled 41/56 to 42/57 contract
        run: |
          test "$(git -C contract rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C predecessor rev-parse HEAD)" = "a6c20e3edfbe85cc68819cd4fadd909472b21fd5"
          test "$(git -C target rev-parse HEAD)" = "38ef0049478e4d62fd465dadc7c1eaf406b9b4d2"
          python - <<'PY'
          import ast
          import json
          import pathlib
          import re

          spec = json.loads(pathlib.Path(
              "contract/engineering/contracts/migration_41_56_to_42_57.json"
          ).read_text(encoding="utf-8"))
          assert spec["contract_version"] == 1
          assert spec["mode"] == "inventory_only"
          assert spec["migration_approved"] is False
          assert spec["source"] == {
              "commit": "a6c20e3edfbe85cc68819cd4fadd909472b21fd5",
              "schema": 41, "rules": 56,
          }
          assert spec["target"] == {
              "commit": "38ef0049478e4d62fd465dadc7c1eaf406b9b4d2",
              "schema": 42, "rules": 57,
          }

          def read(which, module):
              return pathlib.Path(
                  which, "simulation", "src", "carlos_sim", module
              ).read_text(encoding="utf-8")

          src_domain, dst_domain = read("predecessor","domain.py"), read("target","domain.py")
          def versions(content):
              return tuple(int(re.search(r"(?m)^" + field + r"\s*=\s*(\d+)", content).group(1))
                           for field in ("SCHEMA_VERSION", "RULES_VERSION"))
          assert versions(src_domain) == (41, 56)
          assert versions(dst_domain) == (42, 57)
          assert src_domain.replace("SCHEMA_VERSION = 41", "SCHEMA_VERSION = 42").replace(
              "RULES_VERSION = 56", "RULES_VERSION = 57"
          ) == dst_domain

          def fields(content):
              module = ast.parse(content)
              cls = next(x for x in module.body if isinstance(x, ast.ClassDef)
                         and x.name == "WorldState")
              return [x.target.id for x in cls.body if isinstance(x, ast.AnnAssign)
                      and isinstance(x.target, ast.Name)]

          left_fields, right_fields = fields(src_domain), fields(dst_domain)
          assert left_fields == right_fields and len(left_fields) == 55
          assert read("predecessor","store.py") == read("target","store.py")
          src_prod, dst_prod = read("predecessor","production.py"),read("target","production.py")
          assert "_RECIPE_COMPOUND" not in src_prod and "_RECIPE_COMPOUND" in dst_prod
          src_market, dst_market = read("predecessor","market.py"),read("target","market.py")
          assert "reserved_trade_units" not in src_market and "reserved_trade_units" in dst_market

          def routed_event_types(content):
              tree = ast.parse(content)
              fn = next(n for n in tree.body
                        if isinstance(n, ast.FunctionDef) and n.name == "apply_event")
              names = set()
              for n in ast.walk(fn):
                  if not (isinstance(n, ast.Compare) and isinstance(n.left, ast.Name)
                          and n.left.id == "kind"):
                      continue
                  for op, val in zip(n.ops, n.comparators):
                      if isinstance(op, ast.Eq) and isinstance(val, ast.Constant) and isinstance(val.value,str):
                          names.add(val.value)
                      elif isinstance(op, ast.In) and isinstance(val,(ast.Tuple,ast.List)):
                          names.update(v.value for v in val.elts if isinstance(v,ast.Constant)
                                       and isinstance(v.value,str))
              return sorted(names)

          source_dispatch, target_dispatch = routed_event_types(src_domain), routed_event_types(dst_domain)
          assert source_dispatch == target_dispatch and len(source_dispatch) >= 45
          assert len(spec["semantic_review_required_for"]) >= 6
          print("MIG02_CONTRACT_AUDIT " + json.dumps({
              "migration_approved": False, "source": [41,56], "target": [42,57],
              "worldstate_fields": len(left_fields),
              "routed_event_types": len(source_dispatch),
              "store_identical": True,
              "new_compound_recipe": True,
              "new_courier_custody_market_rule": True,
          }, sort_keys=True))
          PY
