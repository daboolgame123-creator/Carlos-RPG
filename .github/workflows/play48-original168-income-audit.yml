name: PLAY48 real day7 wage and starvation causal read-only audit
on:
  push:
    branches: [experiment/play48-real168-causal-audit-20261121]
    paths:
      - 'simulation/scenarios/test_village/play48_original168_income_causal_audit.py'
      - '.github/workflows/play48-original168-income-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect-original-168h-event-ledgers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - name: Download original immutable P0 and P1 168h event ledgers
        uses: actions/download-artifact@v4
        with:
          name: play48-genuine-original96-to168-6e7b3671f6ad3ef29bcf73bd85bec38f330ac3be
          repository: daboolgame123-creator/Carlos-RPG
          run-id: 44894923168
          github-token: ${{ github.token }}
          path: simulation/evidence/saved168
      - name: Read-only original two-world work, food and copper economic audit
        working-directory: simulation
        env:
          PYTHONPATH: src:scenarios/test_village
        run: python -u scenarios/test_village/play48_original168_income_causal_audit.py
