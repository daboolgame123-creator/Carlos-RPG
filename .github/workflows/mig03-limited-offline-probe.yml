name: MIG-03 isolated authentic 41-56 to 42-57 limited replay prototype
on:
  push:
    branches: ["engineering/ci-mig-baseline-20261110"]
    paths: [".github/workflows/mig03-limited-offline-probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-offline-rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: a6c20e3edfbe85cc68819cd4fadd909472b21fd5
          path: predecessor
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 38ef0049478e4d62fd465dadc7c1eaf406b9b4d2
          path: target
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Generate genuine 41-56 bakery production plus market sale with exact old runtime
        env:
          PYTHONPATH: predecessor/simulation/src:predecessor/simulation/tests
        run: |
          test "$(git -C predecessor rev-parse HEAD)" = "a6c20e3edfbe85cc68819cd4fadd909472b21fd5"
          test "$(git -C target rev-parse HEAD)" = "38ef0049478e4d62fd465dadc7c1eaf406b9b4d2"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from carlos_sim import SQLiteEventStore,TimeEngine,NPCMarketService
          from carlos_sim.domain import SCHEMA_VERSION,RULES_VERSION
          from test_market_02c import prepare,_bake,_offer,_buy
          assert (SCHEMA_VERSION,RULES_VERSION)==(41,56)
          path=Path("original-41-56.sqlite")
          with SQLiteEventStore(path) as db:
              prepare(db)
              clock=TimeEngine(db)
              clock.open_session("village")
              try:
                  _bake(db,clock)
                  svc=NPCMarketService(db,clock)
                  _offer(db,svc)
                  state=_buy(db,svc)
                  assert db.verify("village").to_dict()==state.to_dict()
                  assert len(state.market_trades)==1 and len(state.production_jobs)==2
                  Path("expected-original.json").write_text(json.dumps(state.to_dict(),sort_keys=True))
              finally:
                  clock.close_session("village")
          print("MIG03_SOURCE_SHA256",hashlib.sha256(path.read_bytes()).hexdigest(),flush=True)
          PY
      - name: Explicit isolated target reconstruction with original immutable event receipts and authorizations
        env:
          PYTHONPATH: target/simulation/src
        run: |
          python - <<'PY'
          import hashlib
          import inspect
          import json
          import sqlite3
          from pathlib import Path
          from carlos_sim import SQLiteEventStore, TimeEngine
          from carlos_sim.domain import SCHEMA_VERSION,RULES_VERSION,DomainEvent,canonical_hash

          assert (SCHEMA_VERSION,RULES_VERSION)==(42,57)
          source=Path("original-41-56.sqlite")
          destination=Path("converted-42-57.sqlite")
          assert source.exists() and not destination.exists()
          source_hash=hashlib.sha256(source.read_bytes()).hexdigest()
          readonly=sqlite3.connect("file:original-41-56.sqlite?mode=ro",uri=True)
          readonly.row_factory=sqlite3.Row
          world=readonly.execute("SELECT * FROM worlds WHERE id=?",("village",)).fetchone()
          assert (world["schema_version"],world["rules_version"])==(41,56)
          assert canonical_hash(json.loads(world["initial_state"]))==world["initial_hash"]
          flags=[key for key in inspect.signature(SQLiteEventStore.append).parameters
                 if key=="bootstrap" or key.endswith("_authorized")]
          actual_columns={row["name"] for row in readonly.execute("PRAGMA table_info(commands)")}
          assert set(flags)<=actual_columns
          commands=list(readonly.execute("SELECT * FROM commands WHERE world_id=? ORDER BY first_revision",("village",)))
          original_events=list(readonly.execute("SELECT * FROM events WHERE world_id=? ORDER BY seq",("village",)))
          assert len(original_events)==51
          assert all(row["seq"]==i+1 for i,row in enumerate(original_events))
          assert len(commands)>1
          for ev in original_events:
              assert canonical_hash(json.loads(ev["payload"]))==ev["hash"]
          command_map={}
          for command in commands:
              command_events=[e for e in original_events if e["command_id"]==command["command_id"]]
              assert [e["seq"] for e in command_events]==list(range(command["first_revision"],command["last_revision"]+1))
              command_map[command["command_id"]]=(command,command_events)

          with SQLiteEventStore(destination) as dst:
              dst.create_world("village")
              clock=TimeEngine(dst)
              clock.open_session("village")
              try:
                  state=dst.load("village")
                  for row in commands:
                      original,group=command_map[row["command_id"]]
                      assert row["first_revision"]==state.revision+1
                      typed=[DomainEvent.from_dict(json.loads(e["payload"])) for e in group]
                      kwargs={key:bool(original[key]) for key in flags}
                      state=dst.append("village",row["command_id"],state.revision,typed,**kwargs)
                  assert state.revision==world["revision"] and state.time==world["sim_time"]
                  assert dst.verify("village").to_dict()==state.to_dict()
                  assert dst.snapshot("village").to_dict()==state.to_dict()
                  assert dst.db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
                  assert dst.db.execute("PRAGMA foreign_key_check").fetchall()==[]
                  expected=json.loads(Path("expected-original.json").read_text())
                  expected["schema_version"]=42
                  expected["rules_version"]=57
                  assert expected==state.to_dict()
                  new_events=dst.db.execute("SELECT seq,command_id,hash FROM events WHERE world_id=? ORDER BY seq",("village",)).fetchall()
                  assert new_events==[(e["seq"],e["command_id"],e["hash"]) for e in original_events]
                  actual_commands=dst.db.execute("SELECT command_id,request_hash FROM commands WHERE world_id=? ORDER BY first_revision",("village",)).fetchall()
                  assert actual_commands==[(c["command_id"],c["request_hash"]) for c in commands]
              finally:
                  clock.close_session("village")
          readonly.close()
          assert hashlib.sha256(source.read_bytes()).hexdigest()==source_hash
          with SQLiteEventStore(destination) as reopened:
              assert reopened.verify("village").to_dict()==expected
          print("MIG03_LIMITED_CONVERSION_PROOF",json.dumps({
              "source_version":[41,56],"target_version":[42,57],
              "original_sha256_unchanged":True,
              "event_count":len(original_events),"command_count":len(commands),
              "receipts_and_command_hashes_equal":True,
              "target_replay_and_snapshot_equal":True,
              "target_published_to_independent_file_only":True,
              "scope":"seven NPC bakery/market fixture; no courier custody"},
              sort_keys=True),flush=True)
          PY
