name: PLAY48 short genuine paid harvest for severely hungry farmer
on:
  push:
    branches: [experiment/play48-desperate-paid-harvest-20261121]
    paths:
      - 'simulation/src/carlos_sim/economic_autonomy.py'
      - 'simulation/src/carlos_sim/living_world.py'
      - 'simulation/tests/test_play48_desperate_paid_harvest.py'
      - '.github/workflows/play48-desperate-harvest-focused.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-default-off-harvest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Test strict funded real ripe-crop production and regression of old market policy
        working-directory: simulation
        env:
          PYTHONPATH: src:scenarios/test_village
        run: python -m pytest -q tests/test_play48_desperate_paid_harvest.py tests/test_play48_cashless_known_road.py tests/test_play48_community_rations.py
