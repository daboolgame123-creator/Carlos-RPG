name: PLAY48 owner consent aged quote relief focus
on:
  push:
    branches: [experiment/play48-owner-signed-relief-quote-reallocation-20261121]
    paths:
      - 'simulation/src/carlos_sim/community_food.py'
      - 'simulation/src/carlos_sim/economic_autonomy.py'
      - 'simulation/src/carlos_sim/living_world.py'
      - 'simulation/tests/test_play48_owner_approved_quote_relief.py'
      - '.github/workflows/play48-owner-consented-quote-relief.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-verified-financial-ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Prove default parity and signed owner-conserved quote reallocation
        working-directory: simulation
        env:
          PYTHONPATH: src:tests:scenarios/test_village
        run: python -m pytest -q tests/test_play48_owner_approved_quote_relief.py tests/test_play48_community_rations.py tests/test_play48_desperate_paid_harvest.py
