name: PLAY-28B integrated bounded rainfall and replay
on:
  push:
    branches:
      - "design/play28b-integrated-hydrology-20261108"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  water-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Compile, run hydrology and inherited survival tests
        env:
          PYTHONPATH: "src:scenarios/test_village"
        run: |
          python -m compileall -q src tests/test_play28b_hydrology_integrated.py
          python -m pytest -q tests/test_play28b_hydrology_integrated.py tests/test_play_survival_rest_batch_28.py
