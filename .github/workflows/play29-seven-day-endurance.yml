name: PLAY-29 seven-day finite-food seven-NPC endurance
on:
  push:
    branches:
      - "design/play29-seven-day-provisions-20261108"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-seven-days:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Seven days with no automatic rain or food creation, daily full audit
        env:
          PYTHONPATH: "src:scenarios/test_village"
        run: |
          python -m compileall -q src scenarios/test_village/test_play29_seven_day_endurance.py
          python -m pytest -q -s scenarios/test_village/test_play29_seven_day_endurance.py
