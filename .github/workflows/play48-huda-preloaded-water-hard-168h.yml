name: PLAY48 strict 96 168h physical Huda delivery fix release gate
on:
  push:
    branches:
      - experiment/play48-preloaded-water-168h-hardgate-20261114
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: play48-huda-preload-168-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-168h-physical-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10","3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: True 13NPC 168h life, forage, freight, paid work and food gate
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src/carlos_sim scenarios/test_village/test_play48_huda_dispatch_real_168h_hard_gate.py
          PYTHONPATH=src:scenarios/test_village python -m pytest -sv scenarios/test_village/test_play48_huda_dispatch_real_168h_hard_gate.py
