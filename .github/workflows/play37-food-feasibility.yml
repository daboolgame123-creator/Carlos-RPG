name: PLAY-37 closed-world food feasibility

on:
  push:
    branches:
      - feature/play37-root-food-feasibility-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resource-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile source and tests
        run: python -m compileall -q src tests scenarios/test_village
      - name: Check closed-world feasibility and unchanged legacy village controls
        run: |
          PYTHONPATH=src:tests:scenarios/test_village python -m pytest -q -s \
            scenarios/test_village/test_play37_food_feasibility.py \
            scenarios/test_village/test_play35_food_chain_bottlenecks.py \
            scenarios/test_village/test_play34_parallel_village_economies.py \
            scenarios/test_village/test_play33_seven_npc_market.py
