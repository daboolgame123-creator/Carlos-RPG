name: PLAY48 P6 genuine h222 safe paid baker return A B
on:
  pull_request:
    branches: [experiment/play48-funded-starving-farmer-planting-20261121]
  push:
    branches: [experiment/play48-paid-baker-return-20261122]
    paths:
      - 'simulation/src/carlos_sim/routines.py'
      - 'simulation/src/carlos_sim/living_world.py'
      - 'simulation/tests/test_play48_hungry_paid_baker_return.py'
      - 'simulation/scenarios/test_village/play48_real222_paid_baker_return.py'
      - '.github/workflows/play48-authentic222-paid-baker-return.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  strict-focus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Safety and default-off backward regression
        working-directory: simulation
        env:
          PYTHONPATH: src:tests:scenarios/test_village
        run: python -m pytest -q tests/test_play48_hungry_paid_baker_return.py tests/test_play48_funded_starving_farmer_planting.py
  real-saved-p5-vs-p6:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - name: Original unmodified P5 222 hour event ledger
        uses: actions/download-artifact@v4
        with:
          name: play48-authentic-180to222-funded-seed-1d2a349b3bfa2ec1ecbab892bb81898d44f52bc2
          repository: daboolgame123-creator/Carlos-RPG
          run-id: 44930293599
          github-token: ${{ github.token }}
          path: simulation/evidence/authentic222
      - name: Advance two matching immutable saved histories to 228 hours
        working-directory: simulation
        env:
          PYTHONPATH: src:scenarios/test_village
        run: python -u scenarios/test_village/play48_real222_paid_baker_return.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play48-p6-real222-baker-return-${{ github.sha }}
          path: simulation/real222_baker_return/
          if-no-files-found: warn
