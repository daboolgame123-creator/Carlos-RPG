name: PLAY-35 72h NPC food-chain bottleneck audit

on:
  push:
    branches:
      - feature/play35-food-chain-bottleneck-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-food-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile engine and acceptance scenarios
        run: python -m compileall -q src tests scenarios/test_village
      - name: Diagnose independent 72h NPC economies and prior local-market cases
        run: |
          PYTHONPATH=src:tests:scenarios/test_village python -m pytest -q -s \
            scenarios/test_village/test_play35_food_chain_bottlenecks.py \
            scenarios/test_village/test_play34_parallel_village_economies.py \
            scenarios/test_village/test_play33_seven_npc_market.py \
            tests/test_play_market_adaptive_batch_33.py
