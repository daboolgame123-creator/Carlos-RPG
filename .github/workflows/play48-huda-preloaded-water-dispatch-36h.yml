name: PLAY48 genuine preloaded Huda water dispatch (NO MERGE)
on:
  push:
    branches:
      - experiment/play48-preloaded-water-dispatch-20261113
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: play48-preloaded-water-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authentic-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Verify same physically collected water reaches farm before h30 starvation
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src/carlos_sim scenarios/test_village/test_play48_huda_preloaded_water_dispatch_36h.py
          PYTHONPATH=src:scenarios/test_village python -m pytest -sv scenarios/test_village/test_play48_huda_preloaded_water_dispatch_36h.py
