name: PLAY48 12h real finite groundwater with actual paid well work (NO MERGE)

on:
  push:
    branches:
      - feature/play48-authorized-physical-food-for-work-20261113
    paths:
      - "simulation/src/carlos_sim/economic_autonomy.py"
      - "simulation/src/carlos_sim/living_world.py"
      - "simulation/scenarios/test_village/test_play47_joined_professions.py"
      - "simulation/scenarios/test_village/test_play48_finite_aquifer_12h.py"
      - ".github/workflows/play48-real-finite-aquifer-12h.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play48-finite-aquifer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-finite-source-and-paid-work:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Verify exact source SHA and fail-fast compilation
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src/carlos_sim scenarios/test_village/test_play48_finite_aquifer_12h.py
      - name: Physical 13NPC equal genesis 3h 6h 12h pumped vs idle finite aquifer
        run: PYTHONPATH=src:scenarios/test_village python -m pytest -sv scenarios/test_village/test_play48_finite_aquifer_12h.py
