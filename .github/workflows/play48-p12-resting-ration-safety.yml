name: PLAY48 P12 focused resting recipient ration safety
on:
  push:
    branches: [experiment/play48-p12-market-bakery-h264-diagnostics-20261123]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ration-safety:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Test market authorization, original behavior, rest-only consent and strict quotas
        working-directory: simulation
        env:
          PYTHONPATH: src:tests:scenarios/test_village
        run: |
          python -m pytest -q \
            tests/test_play48_community_rations.py \
            tests/test_play48_owner_approved_quote_relief.py \
            tests/test_play48_p12_resting_ration.py
