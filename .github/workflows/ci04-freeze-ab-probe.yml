name: CI-04 freeze optimization paired A/B probe (non-release)

on:
  push:
    branches:
      - "engineering/ci-mig-baseline-20261110"
    paths:
      - ".github/workflows/ci04-freeze-ab-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci04-freeze-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freeze-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Paired full-world 6h freeze trial with replay and output parity
        env:
          PYTHONPATH: src:scenarios/test_village
        run: |
          python - <<'PY'
          import json
          import tempfile
          import time
          from pathlib import Path
          from types import MappingProxyType
          import carlos_sim.domain as domain
          from test_play47_closure_endurance import _seed, _day, _reading

          baseline = domain._freeze

          def type_first_freeze(value):
              kind = type(value)
              if kind is dict:
                  return MappingProxyType({
                      key: type_first_freeze(value[key]) for key in sorted(value)
                  })
              if kind is list:
                  return tuple(type_first_freeze(v) for v in value)
              if isinstance(value, dict):
                  return MappingProxyType({
                      key: type_first_freeze(value[key]) for key in sorted(value)
                  })
              if isinstance(value, list):
                  return tuple(type_first_freeze(v) for v in value)
              return value

          # Explicit type and mutability parity, including subclasses and mapping proxies.
          class SpecialDict(dict):
              pass
          class SpecialList(list):
              pass
          values = [
              {"x": [1, {"y": [None, 0, True]}]},
              SpecialDict({"b": SpecialList([1, 2]), "a": {"k": 1}}),
              MappingProxyType({"x": 1}),
              (1, 2), "text", None,
          ]
          for value in values:
              orig, opt = baseline(value), type_first_freeze(value)
              assert type(orig) is type(opt)
              assert domain._thaw(orig) == domain._thaw(opt)

          measurements = []
          for order in (("baseline", "type_first"), ("type_first", "baseline")):
              round_rows = {}
              for mode in order:
                  with tempfile.TemporaryDirectory(prefix="ci04-ab-") as d:
                      path = Path(d) / "world.sqlite"
                      try:
                          domain._freeze = baseline if mode == "baseline" else type_first_freeze
                          state = _seed(path)
                          start = time.perf_counter()
                          state = _day(path, 6 * 3600, step=6 * 3600, rain=False)
                          duration = time.perf_counter() - start
                          reading = _reading(state)
                          assert reading["npc_hunger_cap"] == 0
                          round_rows[mode] = {
                              "wall_seconds": round(duration, 5),
                              "digest": domain.canonical_hash(state.to_dict()),
                              "revision": state.revision,
                              "time": state.time,
                          }
                      finally:
                          domain._freeze = baseline
              assert round_rows["baseline"]["digest"] == round_rows["type_first"]["digest"]
              assert round_rows["baseline"]["revision"] == round_rows["type_first"]["revision"]
              measurements.append(round_rows)

          print("CI04_FREEZE_AB " + json.dumps(measurements, sort_keys=True))
          PY
