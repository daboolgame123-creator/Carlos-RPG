name: PLAY48 P8 authentic h229 voluntary well-food recovery A B
on:
  push:
    branches: [experiment/play48-courier-earned-food-diagnosis-20261122]
    paths:
      - 'simulation/src/carlos_sim/voluntary_well_food.py'
      - 'simulation/src/carlos_sim/living_world.py'
      - 'simulation/tests/test_play48_voluntary_well_food.py'
      - 'simulation/scenarios/test_village/play48_real229_well_food_recovery.py'
      - '.github/workflows/play48-authentic229-well-food-recovery.yml'
  pull_request:
    branches: [experiment/play48-signed-market-steward-wage-20261122]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  focus:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Verify actual local assistance reducer and voluntary known-road selector
        working-directory: simulation
        env:
          PYTHONPATH: src:tests:scenarios/test_village
        run: python -m pytest -q tests/test_play48_voluntary_well_food.py tests/test_play48_hungry_paid_baker_return.py tests/test_play48_signed_steward_wage_quote_rescue.py
  genuine-p7-to-p8:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - name: Download exact genuine P7 h229 saved world from a successful experiment
        uses: actions/download-artifact@v4
        with:
          name: play48-p7-genuine228-signed-steward-d432dc04166552c3eea90881a8ba7617f2207042
          repository: daboolgame123-creator/Carlos-RPG
          run-id: 45021814734
          github-token: ${{ github.token }}
          path: simulation/evidence/real229
      - name: Run two physical event-sourced h230 to h236 wells and courier A B
        working-directory: simulation
        env:
          PYTHONPATH: src:scenarios/test_village
        run: python -u scenarios/test_village/play48_real229_well_food_recovery.py
      - name: Persist control, treatment, immutable source and conserved receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play48-p8-real229-well-food-a-b-${{ github.sha }}
          path: simulation/real229_well_food_recovery/
          if-no-files-found: warn
