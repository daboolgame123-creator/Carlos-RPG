name: PLAY-48H2 evidence-only per-NPC 72h famine and market access report
on:
  push:
    branches: ["analysis/play48h2-causal-food-access-20261110"]
    paths:
      - ".github/workflows/play48h2-72h-forensic-report.yml"
permissions:
  contents: read
jobs:
  genuine-day3-custody-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install pytest
      - name: Export EXACT persisted thirteen-NPC 24/48/72h access report
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONPATH=src python -m pytest -qs \
            scenarios/test_village/test_play48h2_72h_access_cutoff.py
