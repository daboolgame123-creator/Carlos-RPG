name: PLAY-48L actually earned field-water courier meal 13-NPC A/B
on:
  push:
    branches: ["feature/play48l-farm-water-service-courier-wage-20261110"]
    paths:
      - ".github/workflows/play48l-farm-water-wage.yml"
      - "simulation/src/carlos_sim/courier_provisions.py"
      - "simulation/src/carlos_sim/store.py"
      - "simulation/src/carlos_sim/living_world.py"
      - "simulation/scenarios/test_village/test_play47_joined_professions.py"
      - "simulation/scenarios/test_village/test_play48k_local_bakery_courier_wage.py"
      - "simulation/scenarios/test_village/test_play48l_farm_water_salary.py"
permissions:
  contents: read
concurrency:
  group: play48l-real-wage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authentic-service-and-12h-two-pythons:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        py: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.py }}
      - run: python -m pip install pytest
      - name: Actual funded water-delivery receipt and forged-work security guard
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONPATH=src python -m compileall -q src/carlos_sim/courier_provisions.py src/carlos_sim/store.py src/carlos_sim/living_world.py scenarios/test_village/test_play48l_farm_water_salary.py
          PYTHONPATH=src python -m pytest -qs scenarios/test_village/test_play48l_farm_water_salary.py -k "not 96h_causal_endurance"
  four-day-control-vs-paid-with-physical-food:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install pytest
      - name: Two actual 13-NPC worlds 96h authentic salary and earned food
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONPATH=src python -m pytest -qs scenarios/test_village/test_play48l_farm_water_salary.py -k "96h_causal_endurance"
