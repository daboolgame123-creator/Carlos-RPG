name: J1c2a disposable offline recovery drill

on:
  push:
    branches: [simulation-engine-phase-04a-j1]
    paths:
      - "simulation/scripts/j1c2a_offline_recovery_drill.py"
      - "simulation/src/**"
      - ".github/workflows/j1c2a-offline-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-recovery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install engine and pytest for existing disposable scenario fixture
        run: python -m pip install -e ./simulation pytest
      - name: Run standalone offline backup and recovery drill (not pytest)
        run: python simulation/scripts/j1c2a_offline_recovery_drill.py
