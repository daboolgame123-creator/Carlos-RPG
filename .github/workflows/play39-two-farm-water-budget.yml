name: PLAY-39 real-day two-farm water and food ledger

on:
  push:
    branches:
      - feature/play39-two-farm-water-budget-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measured-weather-and-material-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile simulation and tests
        run: python -m compileall -q src tests scenarios/test_village
      - name: Compare 72h real-day crops, actual measured-water receipts and drought
        run: |
          PYTHONPATH=src:tests:scenarios/test_village python -m pytest -q -s \
            scenarios/test_village/test_play39_rain_drought_real_day.py \
            scenarios/test_village/test_play38_multi_farm_couriers.py \
            scenarios/test_village/test_play37_food_feasibility.py
