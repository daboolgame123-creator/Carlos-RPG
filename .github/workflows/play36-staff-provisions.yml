name: PLAY-36 finite NPC staff rations counterfactual

on:
  push:
    branches:
      - feature/play36-staff-food-allocation-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staff-provisions:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile Python
        run: python -m compileall -q src tests scenarios/test_village
      - name: Test equal-finite-food, 72h staff provision versus market
        run: |
          PYTHONPATH=src:tests:scenarios/test_village python -m pytest -q -s \
            scenarios/test_village/test_play36_staff_rations.py \
            scenarios/test_village/test_play35_food_chain_bottlenecks.py \
            scenarios/test_village/test_play34_parallel_village_economies.py \
            scenarios/test_village/test_play33_seven_npc_market.py
