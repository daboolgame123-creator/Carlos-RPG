name: PLAY-48M read-only charcoal smith chronology
on:
  push:
    branches: ["analysis/play48m-charcoal-buyer-20261110"]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install pytest
      - run: |
          PYTHONPATH=src python -m pytest -qs scenarios/test_village/test_play48m_charcoal_buyer_trace.py
