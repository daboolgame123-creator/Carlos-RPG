name: Carlos WEB-03 smooth Arabic trade and conversations
on:
  push:
    branches: [feature/carlos-web03-fluid-trading-dialogue-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-player-actions:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: '3.10'
            path_sep: ':'
          - os: ubuntu-24.04
            python-version: '3.13'
            path_sep: ':'
          - os: windows-2022
            python-version: '3.13'
            path_sep: ';'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CI tools (not game requirements)
        run: python -m pip install pytest playwright
      - name: Verify WEB-03 quantity, ledger, dialogue, HTTP and compatibility
        working-directory: simulation
        env:
          PYTHONPATH: src${{ matrix.path_sep }}scenarios/test_village
          PYTHONIOENCODING: utf-8
        run: |
          python -m py_compile scenarios/test_village/play_village_web02_ui.py scenarios/test_village/play_village_browser.py scenarios/test_village/test_playable_web03.py
          python -m pytest -q scenarios/test_village/test_playable_web03.py scenarios/test_village/test_playable_web02.py scenarios/test_village/test_playable_arabic_browser.py scenarios/test_village/test_playable_arabic_cli.py scenarios/test_village/test_play31_offline_village.py scenarios/test_village/test_play31_acceptance_journey.py
      - name: Real Chrome click navigation-free multi-quantity buy and NPC greeting
        working-directory: simulation
        env:
          PYTHONPATH: src${{ matrix.path_sep }}scenarios/test_village
          PYTHONIOENCODING: utf-8
        run: python -u scenarios/test_village/playable_browser_chromium_probe.py
