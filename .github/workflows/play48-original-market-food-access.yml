name: PLAY48 why real market bread cannot feed real hungry villagers
on:
  push:
    branches:
      - diagnostic/play48-market-physical-food-access-20261116
    paths:
      - ".github/workflows/play48-original-market-food-access.yml"
      - "simulation/scenarios/test_village/test_play48_real_market_food_access_h60.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authentic-hungry-npc-market-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - name: No code change, actual seller quotes and per-person food access h24-60
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src/carlos_sim scenarios/test_village/test_play48_real_market_food_access_h60.py
          PYTHONPATH=src:scenarios/test_village python -m pytest -sv scenarios/test_village/test_play48_real_market_food_access_h60.py
