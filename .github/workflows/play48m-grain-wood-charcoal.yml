name: PLAY-48M fixed 3-day grain target and paid timber-charcoal cycle
on:
  push:
    branches: ["feature/play48m-fixed-buffer-wood-charcoal-employment-20261110"]
    paths:
      - ".github/workflows/play48m-grain-wood-charcoal.yml"
      - "simulation/scenarios/test_village/test_play47_joined_professions.py"
      - "simulation/scenarios/test_village/test_play48m_finite_employment.py"
      - "simulation/src/carlos_sim/bakery_buffer.py"
      - "simulation/docs/PLAY48M_JOBS_BUFFER_EXPERIMENT.md"
permissions:
  contents: read
concurrency:
  group: play48m-exacthead-${{ github.ref }}
  cancel-in-progress: true
jobs:
  funded-genesis-and-real-12h:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        py: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.py }}
      - run: python -m pip install pytest
      - name: Verify no invented bread or copper; observe new real completed timber job wage
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONPATH=src python -m compileall -q src/carlos_sim/bakery_buffer.py scenarios/test_village/test_play47_joined_professions.py scenarios/test_village/test_play48m_finite_employment.py
          PYTHONPATH=src python -m pytest -qs \
            scenarios/test_village/test_play48m_finite_employment.py \
            -k "not two_day_extended"
  two-day-13npc-actual-demand:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install pytest
      - name: Two-day old 13-person village against same-size market-driven forestry employment
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONPATH=src python -m pytest -qs scenarios/test_village/test_play48m_finite_employment.py -k "two_day_extended"
