name: PLAY-40 physically conserved coin on courier return roads
on:
  push:
    branches:
      - feature/play40-physical-copper-return-20261108
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-coin-logistics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile all source and scenario tests
        run: python -m compileall -q src tests scenarios/test_village
      - name: Test real coin return, legacy no-coin rights, physical farm/food
        run: |
          PYTHONPATH=src:tests:scenarios/test_village python -m pytest -q -s \
            scenarios/test_village/test_play40_copper_cash_courier.py \
            scenarios/test_village/test_play38_multi_farm_couriers.py \
            scenarios/test_village/test_play37_food_feasibility.py
