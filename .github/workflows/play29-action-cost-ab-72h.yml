name: PLAY-29 72-hour controlled real action-hunger A/B
on:
  push:
    branches:
      - "design/play29-action-cost-three-day-20261108"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  action-hunger-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Two real seven-NPC three-day villages with physical conservation
        env:
          PYTHONPATH: "src:scenarios/test_village"
        run: |
          python -m compileall -q src scenarios/test_village/test_play29_activity_cost_ab.py
          python -m pytest -q -s scenarios/test_village/test_play29_activity_cost_ab.py
