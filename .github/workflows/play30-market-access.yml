name: PLAY-30B finite market wallets and real 72h NPC hunger
on:
  push:
    branches:
      - "experiment/play30-physical-wallet-access-20261108"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  purchase-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Three autonomous 72h villages, finite copper and resource audit
        env:
          PYTHONPATH: "src:scenarios/test_village"
        run: |
          python -m compileall -q src scenarios/test_village/play_physical_supply.py scenarios/test_village/test_play30_market_access.py
          python -m pytest -q -s scenarios/test_village/test_play30_market_access.py
