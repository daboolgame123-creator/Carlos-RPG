name: PLAY48 baker bounded 12h food wage experiment
on:
  push:
    branches:
      - experiment/play48-baker-food-wage-12h-20261118
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-boundary:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Verify physical conservation and 12h/36h isolation
        working-directory: simulation
        env:
          PYTHONPATH: src:scenarios/test_village
        run: python -m pytest -q tests/test_play48_baker_12h_food_payroll.py
  real-72-to-96:
    needs: focused-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - name: Download real unchanged 72h control and candidate physical ledgers
        uses: actions/download-artifact@v4
        with:
          name: play48-source-fair-168h-04f1f8c532058a1eb64c1a50d233c9e0619ffb4d
          repository: daboolgame123-creator/Carlos-RPG
          run-id: 44266847089
          github-token: ${{ github.token }}
          path: simulation/evidence
      - name: Resume genuine candidate saved72 to 96 without free resource injection
        working-directory: simulation
        env:
          PYTHONPATH: src:scenarios/test_village
        run: python -u scenarios/test_village/play48_baker_12h_saved72_to96.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play48-baker-12h-real72-to96-${{ github.sha }}
          path: simulation/evidence/
          if-no-files-found: warn
