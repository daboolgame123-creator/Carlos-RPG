name: Simulation regression suite

on:
  push:
    branches:
      - "simulation-engine-phase-*"
  pull_request:
    paths:
      - "simulation/**"
      - ".github/workflows/simulation-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - name: Check out reviewed Phase 01-P baseline
        uses: actions/checkout@v5
        with:
          ref: simulation-engine-phase-01p
          path: reviewed-baseline
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile and verify
        run: |
          python -m compileall -q src tests scenarios
          python -m pytest -q
      - name: Check existing scenario event parity against Phase 01-P
        run: |
          PYTHONPATH=src python scenarios/test_village/bench_event_parity.py --counts 10 25 > /tmp/01q-parity.json
          PYTHONPATH=../reviewed-baseline/simulation/src python scenarios/test_village/bench_event_parity.py --counts 10 25 > /tmp/01p-parity.json
          python - <<'PY'
          import json
          baseline=json.load(open('/tmp/01p-parity.json'))['results']
          candidate=json.load(open('/tmp/01q-parity.json'))['results']
          for old,new in zip(baseline,candidate):
              for key in ('npcs','time','revision','events_count','events_digest','replay_equal'):
                  assert old[key] == new[key], (key,old[key],new[key])
          # Schema 12 adds a gathering history collection and new version
          # identifiers: raw full-state hashes are NOT expected to match.
          PY
