name: Simulation regression suite

on:
  push:
    branches:
      - "simulation-engine-phase-*"
  pull_request:
    paths:
      - "simulation/**"
      - ".github/workflows/simulation-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - name: Check out reviewed Phase 01-R baseline
        uses: actions/checkout@v5
        with:
          ref: 0770498a1f257a252a82fde5ade1c43d3a791e3f
          path: reviewed-baseline
          persist-credentials: false
      - name: Check out genuine Phase 01-S rules 13/17 baseline
        uses: actions/checkout@v5
        with:
          ref: c35245d1904e7a6d779cafa92cbf556618247f38
          path: reviewed-01s
          persist-credentials: false
      - name: Check out frozen Phase 01-T predecessor for 01-U parity
        uses: actions/checkout@v5
        with:
          ref: 60593ce54ba3ea601aa3e17d01f852f97e074ef7
          path: reviewed-01t
          persist-credentials: false
      - name: Check out frozen Phase 01-U predecessor for Phase 01-V default-off parity
        uses: actions/checkout@v5
        with:
          ref: 5c8930b12973e7b764376147d8b43cd105a2beef
          path: reviewed-01u
          persist-credentials: false
      - name: Check out actual Phase 01-V rules 13/18 predecessor
        uses: actions/checkout@v5
        with:
          ref: 6a0f3d473f0eecb856fb2b320e1d6485b032b3bc
          path: reviewed-01v
          persist-credentials: false
      - name: Check out frozen Phase 01-W 13/19 predecessor
        uses: actions/checkout@v5
        with:
          ref: 3fb18d3222ebdc08307d393bab8603a5726dda63
          path: reviewed-01w
          persist-credentials: false
      - name: Check out genuine Phase 01-X 13/20 predecessor
        uses: actions/checkout@v5
        with:
          ref: b1f1c265a09d23cef3a1078cee98e3952a37ab39
          path: reviewed-01x
          persist-credentials: false
      - name: Check out verified Phase 01-Z Schema 14 / Rules 21 predecessor
        uses: actions/checkout@v5
        with:
          ref: 1225ae066f22bc2688a583d46e63ceda80558a07
          path: reviewed-01z
          persist-credentials: false
      - name: Check out genuine Phase 02-A Schema 15 / Rules 22 predecessor
        uses: actions/checkout@v5
        with:
          ref: fdf6162c65d6947507d1b4e4516c17d851873c29
          path: reviewed-02a
          persist-credentials: false
      - name: Check out actual Phase 02-B Schema 16 / Rules 23 predecessor
        uses: actions/checkout@v5
        with:
          ref: 6dbee22a4b6b167a5b5ca5ece1c51612016b9e5d
          path: reviewed-02b
          persist-credentials: false
      - name: Check out genuine Phase 02-C Schema 17 / Rules 24 predecessor
        uses: actions/checkout@v5
        with:
          ref: b1345f69041e76e20b53af26251fc92946eb7230
          path: reviewed-02c
          persist-credentials: false
      - name: Check out genuine Phase 02-D Schema 18 / Rules 25 predecessor
        uses: actions/checkout@v5
        with:
          ref: 65c567e9f4c94672b3f29e2c7ddad3e448cae224
          path: reviewed-02d
          persist-credentials: false
      - name: Check out verified Phase 02-E Schema 19 / Rules 26 predecessor
        uses: actions/checkout@v5
        with:
          ref: c892cb0b3948b2affff03c82c65a3bc243049e39
          path: reviewed-02e
          persist-credentials: false
      - name: Check out verified Phase 02-F Schema 20 / Rules 27 predecessor
        uses: actions/checkout@v5
        with:
          ref: d46aaa04fd53f07e3fd06358f6f62efb904e7452
          path: reviewed-02f
          persist-credentials: false
      - name: Verify frozen 01-R and 01-S compatibility baselines
        run: |
          test "$(git -C ../reviewed-baseline rev-parse HEAD)" = "0770498a1f257a252a82fde5ade1c43d3a791e3f"
          test "$(git -C ../reviewed-01s rev-parse HEAD)" = "c35245d1904e7a6d779cafa92cbf556618247f38"
          test "$(git -C ../reviewed-01t rev-parse HEAD)" = "60593ce54ba3ea601aa3e17d01f852f97e074ef7"
          test "$(git -C ../reviewed-01u rev-parse HEAD)" = "5c8930b12973e7b764376147d8b43cd105a2beef"
          test "$(git -C ../reviewed-01v rev-parse HEAD)" = "6a0f3d473f0eecb856fb2b320e1d6485b032b3bc"
          test "$(git -C ../reviewed-01w rev-parse HEAD)" = "3fb18d3222ebdc08307d393bab8603a5726dda63"
          test "$(git -C ../reviewed-01x rev-parse HEAD)" = "b1f1c265a09d23cef3a1078cee98e3952a37ab39"
          test "$(git -C ../reviewed-01z rev-parse HEAD)" = "1225ae066f22bc2688a583d46e63ceda80558a07"
          test "$(git -C ../reviewed-02a rev-parse HEAD)" = "fdf6162c65d6947507d1b4e4516c17d851873c29"
          test "$(git -C ../reviewed-02b rev-parse HEAD)" = "6dbee22a4b6b167a5b5ca5ece1c51612016b9e5d"
          test "$(git -C ../reviewed-02c rev-parse HEAD)" = "b1345f69041e76e20b53af26251fc92946eb7230"
          test "$(git -C ../reviewed-02d rev-parse HEAD)" = "65c567e9f4c94672b3f29e2c7ddad3e448cae224"
          test "$(git -C ../reviewed-02e rev-parse HEAD)" = "c892cb0b3948b2affff03c82c65a3bc243049e39"
          test "$(git -C ../reviewed-02f rev-parse HEAD)" = "d46aaa04fd53f07e3fd06358f6f62efb904e7452"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile and verify
        run: |
          python -m compileall -q src tests scenarios
          python -m pytest -q
      - name: Smoke-test two-person finite food recovery and eating
        run: PYTHONPATH=src python scenarios/test_village/demo_gathering.py

      - name: Smoke-test 01-W temporary offline Carlos player commands
        run: |
          printf '%s\n' status look 'move square-woods' 'wait 50' look status quit | PYTHONPATH=src python scenarios/test_village/play_local.py > /tmp/01w-local.txt
          grep -q 'rpg_status' /tmp/01w-local.txt
          grep -q 'traveling' /tmp/01w-local.txt
          grep -q 'location_id: woods' /tmp/01w-local.txt
          grep -q 'disposable world discarded' /tmp/01w-local.txt

      - name: Smoke-test 01-Z separate-process resume and independent checkpoints
        run: |
          test_dir="$(mktemp -d)"
          mkdir -p "$test_dir/backups"
          printf '%s\n' 'move square-woods' quit | PYTHONPATH=src python scenarios/test_village/play_resumable_demo.py --db "$test_dir/demo.sqlite" --backups "$test_dir/backups" --new --code-commit "$GITHUB_SHA" --disposable-test > "$test_dir/start.log"
          printf '%s\n' 'wait 50' look remember status quit | PYTHONPATH=src python scenarios/test_village/play_resumable_demo.py --db "$test_dir/demo.sqlite" --backups "$test_dir/backups" --resume --code-commit "$GITHUB_SHA" --disposable-test > "$test_dir/resume.log"
          grep -q 'traveling' "$test_dir/start.log"
          grep -q 'remaining_seconds: 50' "$test_dir/resume.log"
          grep -q 'location_id: woods' "$test_dir/resume.log"
          grep -q 'rpg_status' "$test_dir/resume.log"
          grep -q 'checkpoint:' "$test_dir/start.log"
          grep -q 'checkpoint:' "$test_dir/resume.log"
          PYTHONPATH=src python - "$test_dir" <<'PY'
          from pathlib import Path
          import sys
          from carlos_sim.backup import verify_backup_bundle, restore_backup_bundle
          from carlos_sim import SQLiteEventStore
          root = Path(sys.argv[1])
          folders = sorted((root / 'backups').iterdir())
          assert len(folders) >= 3
          for folder in folders:
              verify_backup_bundle(folder)
          first = folders[0]
          restored = root / 'isolated-restore.sqlite'
          restore_backup_bundle(first, restored)
          with SQLiteEventStore(restored) as db:
              assert db.verify('demo').time == 0
              assert db.db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          with SQLiteEventStore(root / 'demo.sqlite') as db:
              assert db.verify('demo').time == 50
          PY
          rm -rf "$test_dir"

      - name: Smoke-test 02-A finite reserve conversion plus seven-NPC gathering
        run: |
          PYTHONPATH=src python scenarios/test_village/demo_environment_02a.py > /tmp/02a-environment.json
          python - <<'PY'
          import json
          with open('/tmp/02a-environment.json',encoding='utf-8') as f:
              data=json.load(f)
          assert data['npc_count']==7
          assert data['initial_wild_food']==0
          assert data['initial_finite_regrowth_reserve']==2
          assert data['converted_to_wild_food']==2
          assert data['regrowth_reserve_remaining']==0
          assert data['gathered_units']==2
          assert data['replay_verified'] is True
          PY

      - name: Smoke-test 02-E seven-character personalities and grounded memories
        run: |
          PYTHONPATH=src python scenarios/test_village/demo_temperament_02e.py > /tmp/02e-personality.json
          python - <<'PY'
          import json
          with open('/tmp/02e-personality.json', encoding='utf-8') as f:
              d=json.load(f)
          assert d['npc_count']==7
          assert d['basim_action']=='work' and d['nora_action']=='investigate'
          assert d['memory_count']==2
          assert d['replay_verified']
          PY

      - name: Smoke-test 02-D seven-NPC funded loan, escape and overdue copper
        run: |
          PYTHONPATH=src python scenarios/test_village/demo_loans_02d.py > /tmp/02d-debt.json
          python - <<'PY'
          import json
          with open('/tmp/02d-debt.json',encoding='utf-8') as stream:
              d=json.load(stream)
          assert d['npc_count']==7
          assert d['principal_copper']==8 and d['partial_repayment_copper']==3
          assert d['outstanding_at_default_copper']==5
          assert d['debtor_escaped_to']=='square'
          assert d['default_time_seconds']==120
          assert d['final_outstanding_copper']==0
          assert d['recorded_default_preserved']==120
          assert d['total_copper_units_preserved']==25
          assert d['replay_verified']
          PY

      - name: Smoke-test 02-C seven-NPC ownership and local copper market
        run: |
          PYTHONPATH=src python scenarios/test_village/demo_market_02c.py > /tmp/market-02c.json
          python - <<'PY'
          import json
          with open('/tmp/market-02c.json', encoding='utf-8') as f:
              m=json.load(f)
          assert m['npc_count'] == 7 and m['bakers'] == 2
          assert m['grain_start'] == 4 and m['grain_end'] == 0
          assert m['bread_created_by_bakers'] == 2
          assert m['bread_remaining_at_bakery'] == 0
          assert m['bakery_copper_received'] == 6
          assert m['steward_personal_copper_received'] == 0
          assert m['buyers_loaves'] == {'salma': 1, 'huda': 1}
          assert m['buyers_copper_left'] == {'salma': 7, 'huda': 7}
          assert m['replay_verified']
          PY

      - name: Smoke-test 02-B material-backed seven-person bread production
        run: |
          PYTHONPATH=src python scenarios/test_village/demo_production_02b.py > /tmp/02b-bakery.json
          python - <<'PY'
          import json
          with open('/tmp/02b-bakery.json',encoding='utf-8') as f:
              d=json.load(f)
          assert d['npc_count']==7
          assert d['production_jobs_completed']==2
          assert d['grain_before']==4 and d['grain_after']==0
          assert d['bread_before']==0 and d['bread_after']==2
          assert d['ovens_before']==d['ovens_after']==2
          assert d['work_seconds']==90 and d['event_replay_verified']
          PY

      - name: Demonstrate autonomous finite gathering with seven NPCs
        run: PYTHONPATH=src python scenarios/test_village/demo_gathering_autonomy.py

      - name: Reject actual Phase 01-R saved world without rewriting it
        run: |
          PYTHONPATH=../reviewed-baseline/simulation/src python - <<'PY'
          from carlos_sim import SQLiteEventStore, DomainEvent
          with SQLiteEventStore('/tmp/01r-world.sqlite') as db:
              db.create_world('old')
              db.append('old', 'loc', 0, [
                  DomainEvent('LocationCreated', None, 'legacy test', 0,
                              {'id':'village','name':'Village'})])
              db.snapshot('old')
          PY
          PYTHONPATH=src python - <<'PY'
          from carlos_sim import SQLiteEventStore, UnsupportedVersion
          with SQLiteEventStore('/tmp/01r-world.sqlite') as db:
              try:
                  db.load('old')
              except UnsupportedVersion:
                  pass
              else:
                  raise AssertionError('old rules/schema unexpectedly accepted')
              before=db.db.execute('SELECT schema_version,rules_version,revision FROM worlds WHERE id="old"').fetchone()
              assert before==(12,16,1)
              assert db.db.execute('SELECT count(*) FROM events WHERE world_id="old"').fetchone()[0] == 1
              assert db.db.execute('SELECT count(*) FROM snapshots WHERE world_id="old"').fetchone()[0] == 1
          PY

      - name: Reject genuine Phase 01-S rules 13/17 saved world under Phase 01-T
        run: |
          PYTHONPATH=../reviewed-01s/simulation/src python - <<'PY'
          from carlos_sim import SQLiteEventStore, DomainEvent
          with SQLiteEventStore('/tmp/01s-world.sqlite') as db:
              db.create_world('old')
              db.append('old', 'loc', 0, [
                  DomainEvent('LocationCreated', None, 'legacy 01-S test', 0,
                              {'id':'grove','name':'Grove'})])
              db.snapshot('old')
              assert db.db.execute(
                  'SELECT schema_version,rules_version,revision FROM worlds WHERE id="old"'
              ).fetchone() == (13,17,1)
              assert db.verify('old').revision == 1
          PY
          PYTHONPATH=src python - <<'PY'
          from carlos_sim import SQLiteEventStore, UnsupportedVersion
          with SQLiteEventStore('/tmp/01s-world.sqlite') as db:
              before = db.db.execute(
                  'SELECT schema_version,rules_version,revision FROM worlds WHERE id="old"'
              ).fetchone()
              events_before = db.db.execute(
                  'SELECT count(*) FROM events WHERE world_id="old"'
              ).fetchone()[0]
              snapshots_before = db.db.execute(
                  'SELECT count(*) FROM snapshots WHERE world_id="old"'
              ).fetchone()[0]
              assert (before, events_before, snapshots_before) == ((13,17,1),1,1)
              try:
                  db.load('old')
              except UnsupportedVersion:
                  pass
              else:
                  raise AssertionError('13/17 world unexpectedly accepted')
              assert db.db.execute(
                  'SELECT schema_version,rules_version,revision FROM worlds WHERE id="old"'
              ).fetchone() == before
              assert db.db.execute(
                  'SELECT count(*) FROM events WHERE world_id="old"'
              ).fetchone()[0] == events_before
              assert db.db.execute(
                  'SELECT count(*) FROM snapshots WHERE world_id="old"'
              ).fetchone()[0] == snapshots_before
          PY

      - name: Reject genuine 01-V rules 13/18 saved world without mutation
        run: |
          PYTHONPATH=../reviewed-01v/simulation/src python - <<'PY'
          from carlos_sim import SQLiteEventStore, DomainEvent
          with SQLiteEventStore('/tmp/01w-reject-01v.sqlite') as db:
              db.create_world('old')
              db.append('old','location',0,[DomainEvent(
                  'LocationCreated',None,'frozen 01-V world',0,
                  {'id':'market','name':'Market'})])
              db.snapshot('old')
              assert db.db.execute(
                  "SELECT schema_version,rules_version FROM worlds WHERE id='old'"
              ).fetchone() == (13,18)
          PY
          PYTHONPATH=src python - <<'PY'
          from carlos_sim import SQLiteEventStore, UnsupportedVersion
          with SQLiteEventStore('/tmp/01w-reject-01v.sqlite') as db:
              before = db.db.execute(
                  "SELECT revision,sim_time,schema_version,rules_version,initial_state,initial_hash FROM worlds WHERE id='old'"
              ).fetchone()
              logs = db.db.execute(
                  "SELECT payload,hash FROM events WHERE world_id='old' ORDER BY seq"
              ).fetchall()
              snaps = db.db.execute(
                  "SELECT revision,state,hash FROM snapshots WHERE world_id='old'"
              ).fetchall()
              assert before[2:4] == (13,18)
              try:
                  db.load('old')
              except UnsupportedVersion:
                  pass
              else:
                  raise AssertionError('old 13/18 world unexpectedly accepted under Rules 19')
              assert db.db.execute(
                  "SELECT revision,sim_time,schema_version,rules_version,initial_state,initial_hash FROM worlds WHERE id='old'"
              ).fetchone() == before
              assert db.db.execute(
                  "SELECT payload,hash FROM events WHERE world_id='old' ORDER BY seq"
              ).fetchall() == logs
              assert db.db.execute(
                  "SELECT revision,state,hash FROM snapshots WHERE world_id='old'"
              ).fetchall() == snaps
          PY

      - name: Demonstrate 01-S hunger-driven foraging with seven characters
        run: PYTHONPATH=src python scenarios/test_village/demo_foraging.py

      - name: Verify Phase 01-T flag-off parity against real Phase 01-S runtime
        run: |
          PYTHONPATH=src python scenarios/test_village/bench_event_parity.py --counts 7 > /tmp/01t-flag-off.json
          PYTHONPATH=../reviewed-01s/simulation/src python scenarios/test_village/bench_event_parity.py --counts 7 > /tmp/01s-baseline.json
          python - <<'PY'
          import json
          baseline=json.load(open('/tmp/01s-baseline.json'))['results']
          candidate=json.load(open('/tmp/01t-flag-off.json'))['results']
          assert len(baseline) == len(candidate) == 1
          for old, new in zip(baseline, candidate):
              for key in ('npcs','time','revision','events_count','events_digest',
                          'legacy_semantic_digest','replay_equal'):
                  assert old[key] == new[key], (key, old[key], new[key])
              assert old['replay_equal'] is True and new['replay_equal'] is True
          PY

      - name: Verify Phase 01-U opt-out parity against genuine Phase 01-T knowledge-enabled runtime
        run: |
          PYTHONPATH=src python scenarios/test_village/bench_food_knowledge_parity.py > /tmp/01u-default-off.json
          PYTHONPATH=../reviewed-01t/simulation/src python scenarios/test_village/bench_food_knowledge_parity.py > /tmp/01t-with-knowledge.json
          python - <<'PY'
          import json
          old = json.load(open('/tmp/01t-with-knowledge.json'))
          new = json.load(open('/tmp/01u-default-off.json'))
          # Event and semantic-state equality across deliberate Rules 18->20
          # (full state hashes correctly differ because version is persisted).
          assert old['rules_version'] == 18 and new['rules_version'] == 29
          for key in ('npcs', 'time', 'revision', 'events_count',
                      'events_digest', 'state_semantic_digest', 'replay_equal'):
              assert old[key] == new[key], (key, old[key], new[key])
          assert old['replay_equal'] is True
          PY

      - name: Verify Phase 01-V default-off parity against real 01-U with assistance and food navigation active
        run: |
          PYTHONPATH=src python scenarios/test_village/bench_scarcity_disabled_parity.py > /tmp/01v-default-scarcity-off.json
          PYTHONPATH=../reviewed-01u/simulation/src python scenarios/test_village/bench_scarcity_disabled_parity.py > /tmp/01u-frozen.json
          python - <<'PY'
          import json
          baseline = json.load(open('/tmp/01u-frozen.json'))
          candidate = json.load(open('/tmp/01v-default-scarcity-off.json'))
          assert baseline['rules_version'] == 18 and candidate['rules_version'] == 29
          for key in ('npcs', 'time', 'revision', 'events_count',
                      'events_digest', 'state_semantic_digest', 'replay_equal'):
              assert baseline[key] == candidate[key], (key, baseline[key], candidate[key])
          assert baseline['replay_equal'] is True
          PY

      - name: Verify 02-F feature-off parity against frozen genuine 02-E
        run: |
          PYTHONPATH=src python scenarios/test_village/bench_event_parity.py --counts 7 > /tmp/02f-off.json
          PYTHONPATH=../reviewed-02e/simulation/src python scenarios/test_village/bench_event_parity.py --counts 7 > /tmp/02e-frozen.json
          python - <<'PY'
          import json
          old=json.load(open('/tmp/02e-frozen.json'))['results'][0]
          new=json.load(open('/tmp/02f-off.json'))['results'][0]
          for key in ('npcs','time','revision','events_count','events_digest',
                      'legacy_semantic_digest','replay_equal'):
              assert old[key]==new[key], (key,old[key],new[key])
          assert old['replay_equal'] is True
          PY

      - name: Verify Phase 02-G feature OFF against actual Phase 02-F
        run: |
          PYTHONPATH=src python scenarios/test_village/bench_event_parity.py --counts 7 > /tmp/02g-off.json
          PYTHONPATH=../reviewed-02f/simulation/src python scenarios/test_village/bench_event_parity.py --counts 7 > /tmp/02f-frozen.json
          python - <<'PY'
          import json
          old=json.load(open('/tmp/02f-frozen.json'))['results'][0]
          new=json.load(open('/tmp/02g-off.json'))['results'][0]
          for key in ('npcs','time','revision','events_count','events_digest',
                      'legacy_semantic_digest','replay_equal'):
              assert old[key] == new[key], (key,old[key],new[key])
          assert old['replay_equal'] and new['replay_equal']
          PY

      - name: Check existing seven-NPC event and semantic state parity against Phase 01-R
        run: |
          PYTHONPATH=src python scenarios/test_village/bench_event_parity.py --counts 7 > /tmp/01s-parity.json
          PYTHONPATH=../reviewed-baseline/simulation/src python scenarios/test_village/bench_event_parity.py --counts 7 > /tmp/01r-parity.json
          python - <<'PY'
          import json
          baseline=json.load(open('/tmp/01r-parity.json'))['results']
          candidate=json.load(open('/tmp/01s-parity.json'))['results']
          for old,new in zip(baseline,candidate):
              for key in ('npcs','time','revision','events_count','events_digest','legacy_semantic_digest','replay_equal'):
                  assert old[key] == new[key], (key,old[key],new[key])
          # Rule/Schema 17/13 add a new ledger: full state digests differ.
          # All legacy event digests and semantically matching state fields must remain equal.
          PY

      - name: Reject real Phase 01-W Rules 19 SQLite world without mutation
        run: |
          PYTHONPATH=../reviewed-01w/simulation/src python - <<'PY'
          from carlos_sim import SQLiteEventStore, DomainEvent
          with SQLiteEventStore('/tmp/01w-for-01x.sqlite') as db:
              db.create_world('legacy')
              db.append('legacy', 'location', 0, [
                  DomainEvent('LocationCreated', None, 'baseline', 0,
                              {'id':'square','name':'Square'})])
              db.snapshot('legacy')
              assert db.db.execute('SELECT schema_version,rules_version,revision FROM worlds WHERE id="legacy"').fetchone() == (13,19,1)
          PY
          PYTHONPATH=src python - <<'PY'
          from carlos_sim import SQLiteEventStore, UnsupportedVersion
          with SQLiteEventStore('/tmp/01w-for-01x.sqlite') as db:
              def record():
                  metadata=db.db.execute('SELECT schema_version,rules_version,revision FROM worlds WHERE id="legacy"').fetchone()
                  counts=tuple(db.db.execute('SELECT count(*) FROM '+table+' WHERE world_id="legacy"').fetchone()[0] for table in ('events','snapshots'))
                  return metadata, counts
              before=record()
              try:
                  db.load('legacy')
              except UnsupportedVersion:
                  pass
              else:
                  raise AssertionError('13/19 world silently accepted')
              assert record()==before
          PY

      - name: Reject actual Phase 01-X 13/20 SQLite file without mutation
        run: |
          PYTHONPATH=../reviewed-01x/simulation/src python - <<'PY'
          from carlos_sim import SQLiteEventStore, DomainEvent
          with SQLiteEventStore('/tmp/01x-predecessor.sqlite') as db:
              db.create_world('old')
              db.append('old','genesis',0,[DomainEvent('LocationCreated',None,'01X old world',0,
                  {'id':'village','name':'Village'})])
              db.snapshot('old')
              assert db.db.execute('SELECT schema_version,rules_version FROM worlds WHERE id="old"').fetchone() == (13,20)
