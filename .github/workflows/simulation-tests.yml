name: Simulation regression suite

on:
  push:
    branches:
      - "simulation-engine-phase-*"
  pull_request:
    paths:
      - "simulation/**"
      - ".github/workflows/simulation-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - name: Check out reviewed Phase 01-N baseline
        uses: actions/checkout@v5
        with:
          ref: simulation-engine-phase-01n
          path: reviewed-baseline
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile and verify
        run: |
          python -m compileall -q src tests scenarios
          python -m pytest -q
      - name: Compare complete event and state hashes with reviewed baseline
        run: |
          PYTHONPATH=src python scenarios/test_village/bench_event_parity.py --counts 10 25 > /tmp/01o-parity.json
          PYTHONPATH=../reviewed-baseline/simulation/src python scenarios/test_village/bench_event_parity.py --counts 10 25 > /tmp/01n-parity.json
          diff -u /tmp/01n-parity.json /tmp/01o-parity.json
