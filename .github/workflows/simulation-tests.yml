name: Simulation regression suite

on:
  push:
    branches:
      - "simulation-engine-phase-*"
  pull_request:
    paths:
      - "simulation/**"
      - ".github/workflows/simulation-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - name: Check out reviewed Phase 01-O baseline
        uses: actions/checkout@v5
        with:
          ref: simulation-engine-phase-01o
          path: reviewed-baseline
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile and verify
        run: |
          python -m compileall -q src tests scenarios
          python -m pytest -q
      - name: Compare complete event and state hashes with reviewed baseline
        run: |
          PYTHONPATH=src python scenarios/test_village/bench_event_parity.py --counts 10 25 50 > /tmp/01p-parity.json
          PYTHONPATH=../reviewed-baseline/simulation/src python scenarios/test_village/bench_event_parity.py --counts 10 25 50 > /tmp/01o-parity.json
          diff -u /tmp/01o-parity.json /tmp/01p-parity.json
      - name: Measure candidate and baseline replay queries without timing gates
        run: |
          PYTHONPATH=../reviewed-baseline/simulation/src python scenarios/test_village/bench_replay_store.py --counts 10 50 100 > /tmp/replay-baseline.json
          PYTHONPATH=src python scenarios/test_village/bench_replay_store.py --counts 10 50 100 > /tmp/replay-candidate.json
          echo "Reviewed 01-O baseline:" && cat /tmp/replay-baseline.json
          echo "01-P candidate:" && cat /tmp/replay-candidate.json
      - name: Compare full living-world engine speed and event counts
        run: |
          PYTHONPATH=../reviewed-baseline/simulation/src python scenarios/test_village/bench_living_world.py --counts 10 25 50 100 150 > /tmp/engine-01o.json
          PYTHONPATH=src python scenarios/test_village/bench_living_world.py --counts 10 25 50 100 150 > /tmp/engine-01p.json
          echo "Baseline full engine:" && cat /tmp/engine-01o.json
          echo "Candidate full engine:" && cat /tmp/engine-01p.json
          python - <<'PY'
          import json
          a=json.load(open("/tmp/engine-01o.json"))["results"]
          b=json.load(open("/tmp/engine-01p.json"))["results"]
          for old,new in zip(a,b):
              assert old["npcs"]==new["npcs"]
              assert old["advance_events"]==new["advance_events"]
              assert old["actual_simulated_seconds"]==new["actual_simulated_seconds"]
          PY
