name: Simulation regression suite

on:
  push:
    branches:
      - "simulation-engine-phase-*"
  pull_request:
    paths:
      - "simulation/**"
      - ".github/workflows/simulation-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile and verify
        run: |
          python -m compileall -q src tests scenarios
          python -m pytest -q
