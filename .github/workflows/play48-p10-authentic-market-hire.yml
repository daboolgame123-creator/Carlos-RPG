name: PLAY48 P10 actual local market wage rescues hungry courier
on:
  push:
    branches: [experiment/play48-p10-local-signed-food-employment-20261123]
    paths:
      - 'simulation/src/carlos_sim/freight_payroll.py'
      - 'simulation/src/carlos_sim/domain.py'
      - 'simulation/src/carlos_sim/living_world.py'
      - 'simulation/tests/test_play48_p10_local_market_employment.py'
      - 'simulation/scenarios/test_village/play48_p10_real236_signed_market_huda.py'
      - '.github/workflows/play48-p10-authentic-market-hire.yml'
  pull_request:
    branches: [experiment/play48-p9-second-courier-finite-food-20261123]
permissions:
  contents: read
  actions: read
jobs:
  security-focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Fetch immutable P9 h244 world for rights tests
        uses: actions/download-artifact@v4
        with:
          name: play48-p9-h236-h244-real-hunter-b5da2c348f8380c65e1353cc85fa698c6702f050
          repository: daboolgame123-creator/Carlos-RPG
          run-id: 45132668990
          github-token: ${{ github.token }}
          path: simulation/evidence/p9_real244
      - name: Verify no unauthorised new agreement, cargo-less pay, or quote theft
        working-directory: simulation
        env:
          PYTHONPATH: src:tests:scenarios/test_village
        run: python -m pytest -q tests/test_play48_p10_local_market_employment.py tests/test_play48_hunter_scout_well_food.py tests/test_play48_voluntary_well_food.py
  genuine:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - name: Recover exact P8 h236 saved 13-NPC event world
        uses: actions/download-artifact@v4
        with:
          name: play48-p8-real229-well-food-a-b-ba0162ae3692638a073cdd0197b4f02b57c551a1
          repository: daboolgame123-creator/Carlos-RPG
          run-id: 45026222815
          github-token: ${{ github.token }}
          path: simulation/evidence/p8_real236
      - name: Fetch untouched successful P9 h244 comparison
        uses: actions/download-artifact@v4
        with:
          name: play48-p9-h236-h244-real-hunter-b5da2c348f8380c65e1353cc85fa698c6702f050
          repository: daboolgame123-creator/Carlos-RPG
          run-id: 45132668990
          github-token: ${{ github.token }}
          path: simulation/evidence/p9_real244
      - name: Verify P10 actual saved h236→h244 Huda wage and physically eaten food
        working-directory: simulation
        env:
          PYTHONPATH: src:scenarios/test_village
        run: python -u scenarios/test_village/play48_p10_real236_signed_market_huda.py
      - name: Keep real SQLite event evidence and A/B verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play48-p10-genuine-h236-market-hire-${{ github.sha }}
          path: simulation/real236_signed_market_courier/
          if-no-files-found: warn
