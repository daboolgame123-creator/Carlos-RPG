name: MIG-02b real 41-56 event semantics read-only probe
on:
  push:
    branches: ["engineering/ci-mig-baseline-20261110"]
    paths: [".github/workflows/mig02b-real-events-probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-event-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: a6c20e3edfbe85cc68819cd4fadd909472b21fd5
          path: predecessor
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 38ef0049478e4d62fd465dadc7c1eaf406b9b4d2
          path: target
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Create actual 41-56 bakery production and market world with old runtime
        env:
          PYTHONPATH: predecessor/simulation/src:predecessor/simulation/tests
        run: |
          test "$(git -C predecessor rev-parse HEAD)" = "a6c20e3edfbe85cc68819cd4fadd909472b21fd5"
          test "$(git -C target rev-parse HEAD)" = "38ef0049478e4d62fd465dadc7c1eaf406b9b4d2"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from carlos_sim import SQLiteEventStore, TimeEngine
          from carlos_sim.domain import SCHEMA_VERSION, RULES_VERSION
          from test_market_02c import prepare, _bake, _offer, _buy
          assert (SCHEMA_VERSION,RULES_VERSION) == (41,56)
          path=Path("genuine-41-56.sqlite")
          with SQLiteEventStore(path) as db:
              prepare(db)
              clock=TimeEngine(db)
              clock.open_session("village")
              try:
                  _bake(db,clock)
                  _offer(db,db and __import__("carlos_sim").NPCMarketService(db,clock))
                  sold=_buy(db,__import__("carlos_sim").NPCMarketService(db,clock))
                  assert db.verify("village").to_dict()==sold.to_dict()
                  assert sold.market_trades and sold.production_jobs
                  Path("old-expected.json").write_text(json.dumps(sold.to_dict(),sort_keys=True))
              finally:
                  clock.close_session("village")
          print("MIG02B_ORIGINAL_SOURCE",json.dumps({
              "version":[41,56],
              "db_sha256":hashlib.sha256(path.read_bytes()).hexdigest(),
              "world_revision":sold.revision,"events":sold.revision,
              "trades":len(sold.market_trades),"jobs":len(sold.production_jobs)},sort_keys=True))
          PY
      - name: Reproject genuine old events in memory with strict new reducer and original command capabilities
        env:
          PYTHONPATH: target/simulation/src
        run: |
          python - <<'PY'
          import hashlib
          import inspect
          import json
          import sqlite3
          from pathlib import Path
          from carlos_sim.domain import SCHEMA_VERSION,RULES_VERSION,WorldState,DomainEvent,apply_event,canonical_hash
          assert (SCHEMA_VERSION,RULES_VERSION)==(42,57)
          path=Path("genuine-41-56.sqlite")
          digest=hashlib.sha256(path.read_bytes()).hexdigest()
          cx=sqlite3.connect("file:genuine-41-56.sqlite?mode=ro",uri=True)
          cx.row_factory=sqlite3.Row
          old=cx.execute("SELECT * FROM worlds WHERE id='village'").fetchone()
          assert (old["schema_version"],old["rules_version"])==(41,56)
          initial=json.loads(old["initial_state"])
          assert canonical_hash(initial)==old["initial_hash"]
          initial["schema_version"]=42
          initial["rules_version"]=57
          state=WorldState.from_dict(initial)
          flags=[name for name in inspect.signature(apply_event).parameters
                 if name=="bootstrap" or name.endswith("_authorized")]
          command_columns={r["name"] for r in cx.execute("PRAGMA table_info(commands)")}
          assert set(flags)<=command_columns
          sql="SELECT e.seq,e.payload,e.hash,c.request_hash,"+",".join("c."+f for f in flags)+ " FROM events e LEFT JOIN commands c ON c.world_id=e.world_id AND c.command_id=e.command_id WHERE e.world_id=? ORDER BY e.seq"
          counts={}
          for line in cx.execute(sql,("village",)):
              assert line["seq"]==state.revision+1
              assert line["request_hash"] is not None
              data=json.loads(line["payload"])
              assert canonical_hash(data)==line["hash"]
              event=DomainEvent.from_dict(data)
              counts[event.event_type]=counts.get(event.event_type,0)+1
              kwargs={f:bool(line[f]) for f in flags}
              state=apply_event(state,event,**kwargs)
          assert state.revision==old["revision"] and state.time==old["sim_time"]
          actual=state.to_dict()
          expected=json.loads(Path("old-expected.json").read_text())
          expected["schema_version"]=42
          expected["rules_version"]=57
          mismatches=[k for k in expected if expected[k]!=actual[k]]
          if mismatches:
              print("MIG02B_UNSUPPORTED_SEMANTIC_MIGRATION",json.dumps({"mismatch_keys":mismatches,"event_count":state.revision,"kinds":counts},sort_keys=True))
          assert not mismatches, "Old valid event trace is not semantically preserved on the target (no migration attempted)"
          assert hashlib.sha256(path.read_bytes()).hexdigest()==digest
          cx.close()
          print("MIG02B_READ_ONLY_PARITY",json.dumps({
              "version_source":[41,56],"version_target_projection":[42,57],
              "event_count":state.revision,"event_kinds":counts,
              "original_sha256_unchanged":True,"full_worldstate_semantic_equal":True,
              "market_trades":len(state.market_trades),"production_jobs":len(state.production_jobs)
          },sort_keys=True))
          PY
