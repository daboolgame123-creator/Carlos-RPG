name: PLAY-48Y2 complete historic regression except separate true 96h A-B
on:
  push:
    branches: ["experiment/play48y2-farm-wage-96h-and-workforce-20261111"]
    paths:
      - ".github/workflows/play48y2-full-regression.yml"
permissions:
  contents: read
concurrency:
  group: play48y2-historic-full-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-actual-world-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: All historic and new tests, separate 96h scenario in independent exact-SHA workflow
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src tests scenarios
          # The exact same SHA is covered by the separate 96h Y2 A/B
          # workflow. Do not execute that heavy test AGAIN here: this
          # regression covers all other historical and new tests.
          python -m pytest -q --tb=line -k 'not test_96h_huda_farm_wages_vs_true_identical_unpaid_world'
