name: PLAY-48Y2 complete historic regression under current experimental 44 59
on:
  push:
    branches: ["experiment/play48y2-farm-wage-96h-and-workforce-20261111"]
    paths:
      - ".github/workflows/play48y2-full-regression.yml"
permissions:
  contents: read
concurrency:
  group: play48y2-historic-full-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-actual-world-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Historic and current source, immutable exact-SHA full regression
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src tests scenarios
          python -m pytest -q --tb=line
