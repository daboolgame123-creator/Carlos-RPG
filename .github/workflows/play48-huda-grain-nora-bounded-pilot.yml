name: PLAY48 Huda + funded grain Nora bounded pilot
on:
  push:
    branches:
      - experiment/play48-huda-funded-grain-nora-20261118
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  separate-contracts:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Original ownership, authentic Huda services, genuine grain cash, forgery rejection
        working-directory: simulation
        env:
          PYTHONPATH: src:scenarios/test_village
        run: python -m pytest -q tests/test_play48_huda_grain_payment_pilot.py tests/test_play48_grain_purchase.py
  village-60h:
    needs: separate-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - name: Authentic original 13-person 24/48/60 hour A/B and economic gates
        working-directory: simulation
        env:
          PYTHONPATH: src:scenarios/test_village
        run: python -u scenarios/test_village/play48_integrated_acceptance.py --directory evidence --hours 60
      - name: Save actual world evidence even on failed acceptance
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play48-huda-grain-nora-${{ github.sha }}
          path: simulation/evidence/
