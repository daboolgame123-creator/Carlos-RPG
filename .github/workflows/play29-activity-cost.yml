name: PLAY-29 bounded per-action hunger cost on real NPCs
on:
  push:
    branches:
      - "design/play29-activity-hunger-policy-20261108"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  action-costs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Test real action costs, default behavior and SQLite replay
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src tests/test_play29_activity_hunger_policy.py
          python -m pytest -q tests/test_play29_activity_hunger_policy.py tests/test_living_world.py tests/test_survival.py
