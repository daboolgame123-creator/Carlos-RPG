name: PLAY48 P12 authentic h264 A/B resting ration baker rescue gate
on:
  push:
    branches: [experiment/play48-p12-market-bakery-h264-diagnostics-20261123]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  genuine-p11-versus-p12:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install scenario integration test imports
        run: python -m pip install pytest
      - name: Download original, verified, unchanged P11 h264 SQLite
        uses: actions/download-artifact@v4
        with:
          repository: daboolgame123-creator/Carlos-RPG
          run-id: 45186883684
          name: play48-p11-renewable-h264-af1025807f4fb5f3b653bdd6a8dbee3bb01f8455
          path: simulation/evidence/p12_real264
          github-token: ${{ github.token }}
      - name: Two-arm real P11 vs opt-in P12 h264 to h270, audited original SHA
        working-directory: simulation
        env:
          PYTHONPATH: src:scenarios/test_village
        run: python -u scenarios/test_village/play48_p12_h264_short_unmodified.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play48-p12-resting-a-b-h270-${{ github.sha }}
          path: simulation/play48_p12_short_continuation/comparison.json
          if-no-files-found: warn
