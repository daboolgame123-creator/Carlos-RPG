name: PLAY-28B measured rain three-day real living world
on:
  push:
    branches:
      - "design/play28b-water-endurance-20261108"
      - "design/play28b-release-candidate-20261108"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measured-water:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Real 72-hour wet village, replay and material conservation
        env:
          PYTHONPATH: "src:scenarios/test_village"
        run: |
          python -m compileall -q src scenarios/test_village/test_play28b_three_day_water.py
          python -m pytest -q -s scenarios/test_village/test_play28b_three_day_water.py
