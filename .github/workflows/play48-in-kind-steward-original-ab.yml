name: PLAY48 in-kind merchant sales wage original 13NPC AB

on:
  push:
    branches:
      - experiment/play48-in-kind-market-steward-revenue-20261115
    paths:
      - ".github/workflows/play48-in-kind-steward-original-ab.yml"
      - "simulation/src/carlos_sim/**"
      - "simulation/scenarios/test_village/test_play48_in_kind_market_wages_ab.py"
      - "simulation/scenarios/test_village/test_play48_real_watch_income_24h.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  basic-payroll-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - name: Compile and reject fraudulent food wage without a real sale
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src/carlos_sim scenarios/test_village/test_play48_in_kind_market_wages_ab.py
          PYTHONPATH=src:scenarios/test_village python -m pytest -q -s scenarios/test_village/test_play48_in_kind_market_wages_ab.py -k forged

  original-world-48h-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - name: Compare genuine 13 NPCs at 6,24,30,36,48 hours
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src/carlos_sim scenarios/test_village/test_play48_in_kind_market_wages_ab.py
          PYTHONPATH=src:scenarios/test_village python -m pytest -sv scenarios/test_village/test_play48_in_kind_market_wages_ab.py -k real_13npc
