name: PLAY-44 autonomous grain procurement and bread economy

on:
  push:
    branches:
      - "feature/play44-autonomous-grain-procurement-20261109"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile and prove two autonomous village production loops
        run: |
          python -m compileall -q src scenarios
          PYTHONPATH=src python -m pytest -q -s \
            scenarios/test_village/test_play44_autonomous_grain.py \
            scenarios/test_village/test_play43_grain_deposit.py \
            scenarios/test_village/test_play42_market_shopping.py
