name: Carlos WEB-01 Arabic browser RTL and localhost game
on:
  push:
    branches: [feature/carlos-arabic-browser-local-play-20261123]
  pull_request:
    paths:
      - 'simulation/scenarios/test_village/play_village_browser.py'
      - 'simulation/scenarios/test_village/test_playable_arabic_browser.py'
      - '.github/workflows/playable-arabic-browser-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-player:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: '3.10'
            path_sep: ':'
          - os: ubuntu-24.04
            python-version: '3.13'
            path_sep: ':'
          - os: windows-2022
            python-version: '3.13'
            path_sep: ';'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Compile and test authentic loopback Arabic browser play
        working-directory: simulation
        env:
          PYTHONPATH: src${{ matrix.path_sep }}scenarios/test_village
          PYTHONIOENCODING: utf-8
        run: |
          python -m py_compile scenarios/test_village/play_village_browser.py scenarios/test_village/test_playable_arabic_browser.py
          python -m pytest -q scenarios/test_village/test_playable_arabic_browser.py scenarios/test_village/test_playable_arabic_cli.py scenarios/test_village/test_play31_offline_village.py scenarios/test_village/test_play31_acceptance_journey.py
