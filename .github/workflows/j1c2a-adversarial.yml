name: J1c2a adversarial regression

on:
  push:
    branches: [simulation-engine-phase-04a-j1]
    paths:
      - "simulation/src/**"
      - "simulation/tests/**"
      - "simulation/pyproject.toml"
      - ".github/workflows/j1c2a-adversarial.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  j1c2a-adversarial:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tests and simulation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./simulation pytest
      - name: Compile simulation
        run: python -m compileall -q simulation/src simulation/tests
      - name: Run adversarial regression probes
        working-directory: simulation
        run: python -m pytest -q tests/test_adversarial_registered_claims_04a_j1c2.py
      - name: Run full simulation regression suite
        working-directory: simulation
        run: python -m pytest -q
