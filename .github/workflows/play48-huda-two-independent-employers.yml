name: PLAY48 two distinct bakery and market earned food wages 48h (NO MERGE)
on:
  push:
    branches:
      - experiment/play48-dual-site-earned-huda-food-20261114
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: play48-huda-dual-earned-food-${{ github.ref }}
  cancel-in-progress: true
jobs:
  honest-dual-employer-courier:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: 48h 13NPC two *different* real delivery receipts, stock and survival
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src/carlos_sim scenarios/test_village/test_play48_huda_two_real_employers_48h.py
          PYTHONPATH=src:scenarios/test_village python -m pytest -sv scenarios/test_village/test_play48_huda_two_real_employers_48h.py
