name: PLAY-33 autonomous NPC adaptive local market

on:
  push:
    branches:
      - feature/play33-npc-market-adaptation-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-economy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile modified source and tests
        run: python -m compileall -q src tests scenarios/test_village
      - name: New adaptive market acceptance and legacy autonomous regressions
        run: |
          PYTHONPATH=src:tests:scenarios/test_village python -m pytest -q \
            tests/test_play_market_adaptive_batch_33.py \
            tests/test_play_economic_autonomy_batch_24.py \
            tests/test_market_02c.py \
            scenarios/test_village/test_play30c_stocked_market.py
