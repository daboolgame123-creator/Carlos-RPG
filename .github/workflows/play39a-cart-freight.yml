name: PLAY-39A physical cart freight and cargo provenance

on:
  push:
    branches:
      - feature/play39a-finite-cart-loads-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cart-cargo:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tests
        run: python -m pip install pytest
      - name: Compile full source and fixture tree
        run: python -m compileall -q src tests scenarios/test_village
      - name: Verify physical bounded multiunit cargo and legacy route behavior
        run: |
          PYTHONPATH=src:tests:scenarios/test_village python -m pytest -q -s \
            scenarios/test_village/test_play39_cart_freight.py \
            scenarios/test_village/test_play38_multi_farm_couriers.py \
            scenarios/test_village/test_play37_food_feasibility.py \
            tests/test_play_physical_supply_batch_27.py \
            tests/test_consumption.py
