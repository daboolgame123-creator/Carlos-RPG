name: PLAY48 48h real post24 income and production blockers (NO MERGE)
on:
  push:
    branches:
      - experiment/play48-funded-guard-service-income-20261113
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: play48-real-post24-48h-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-48h-stop-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Read-only actual 13NPC 48h source-of-truth blockers
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src/carlos_sim scenarios/test_village/test_play48_watch_post24_48h.py
          PYTHONPATH=src:scenarios/test_village python -m pytest -sv scenarios/test_village/test_play48_watch_post24_48h.py
