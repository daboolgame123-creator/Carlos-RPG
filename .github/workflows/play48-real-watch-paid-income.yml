name: PLAY48 actual physical guard job -> earned copper -> food trade (NO MERGE)
on:
  push:
    branches:
      - experiment/play48-funded-guard-service-income-20261113
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: play48-guard-real-income-${{ github.ref }}
  cancel-in-progress: true
jobs:
  timed-work-funds-real-purchase:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Verify exact source and actual 13NPC no-gift 24h security worker
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q src/carlos_sim scenarios/test_village/test_play48_real_watch_income_24h.py
          PYTHONPATH=src:scenarios/test_village python -m pytest -sv scenarios/test_village/test_play48_real_watch_income_24h.py
      - name: CONTROLLED physical baseline vs funded guard 6-12-18-24h A B
        run: |
          python -m compileall -q scenarios/test_village/test_play48_watch_income_ab_24h.py
          PYTHONPATH=src:scenarios/test_village python -m pytest -sv scenarios/test_village/test_play48_watch_income_ab_24h.py
