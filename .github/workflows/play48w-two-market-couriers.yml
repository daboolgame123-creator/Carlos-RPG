name: PLAY-48W two market courier employers true 48h A-B
on:
  push:
    branches: ["experiment/play48w-two-market-courier-contracts-20261111"]
    paths:
      - ".github/workflows/play48w-two-market-couriers.yml"
      - "simulation/scenarios/test_village/test_play48w_two_market_couriers.py"
permissions:
  contents: read
concurrency:
  group: play48w-two-wage-couriers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  genuine-signatures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: At most three real opening loaves and signed employer contracts
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m compileall -q scenarios/test_village/test_play48w_two_market_couriers.py
          PYTHONPATH=src python -m pytest -qs scenarios/test_village/test_play48w_two_market_couriers.py -k "not true_48h"
  actual-forty-eight-hour-two-market-contracts:
    needs: genuine-signatures
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Physically owned merchant wages for both couriers after real work
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONPATH=src python -m pytest -qs scenarios/test_village/test_play48w_two_market_couriers.py -k "true_48h"
