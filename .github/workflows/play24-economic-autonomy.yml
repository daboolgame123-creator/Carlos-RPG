name: PLAY-24 autonomous physical food economy

on:
  push:
    branches:
      - simulation-engine-phase-play-24-economic-autonomy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-economy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile source and tests
        run: python -m compileall -q src scenarios/test_village tests
      - name: Run autonomous economic integration and original finite food chain
        run: |
          PYTHONPATH=src:tests:scenarios/test_village python -m pytest -q \
            tests/test_play_economic_autonomy_batch_24.py \
            tests/test_play_food_chain_batch_23.py \
            tests/test_production_02b.py \
            tests/test_market_02c.py \
            tests/test_consumption.py
      - name: Run real seven-NPC village trials
        run: PYTHONPATH=src:scenarios/test_village python -u scenarios/test_village/play_economic_autonomy.py
