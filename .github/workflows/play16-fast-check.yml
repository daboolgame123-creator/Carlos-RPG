name: PLAY-16 targeted player-memory checks

on:
  push:
    branches:
      - simulation-engine-phase-play-16-witnessed-memory
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile source and test relevant player boundaries
        run: |
          python -m compileall -q src tests
          PYTHONPATH=src:scenarios/test_village:tests python -m pytest -q \
            tests/test_player_witnessed_memory_batch_16.py \
            tests/test_play_npc_survival_batch_15.py \
            tests/test_player_perception.py \
            tests/test_player_handoff_play_batch.py \
            tests/test_player_gateway.py
