name: PLAY-28B three-day drought-vs-rain live counterfactual
on:
  push:
    branches:
      - "design/play28b-drought-rain-comparison-20261108"
      - "design/play28b-release-candidate-20261108"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seven-npc-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Seven-NPC real A/B drought and rainfall with exact conservation
        env:
          PYTHONPATH: "src:scenarios/test_village"
        run: |
          python -m compileall -q src scenarios/test_village/test_play28b_drought_rain_comparison.py
          python -m pytest -q -s scenarios/test_village/test_play28b_drought_rain_comparison.py
